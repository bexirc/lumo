<style>
:root{color-scheme:dark;--bg:#0b0b0e;--surface:#17171c;--surface2:#202027;--surface3:#292932;--text:#f7f7fa;--muted:#a4a4b0;--line:rgba(255,255,255,.09);--pink:#fa2d48;--pink-soft:rgba(250,45,72,.15);--green:#55c98b;--yellow:#ffd166;--blue:#7aa7ff;--shadow:0 18px 55px rgba(0,0,0,.35);--glass:rgba(27,27,34,.78);--radius:22px}
:root[data-theme="light"]{color-scheme:light;--bg:#f5f5f8;--surface:#fff;--surface2:#f0f0f5;--surface3:#e5e5ec;--text:#17171b;--muted:#70707c;--line:rgba(0,0,0,.09);--pink:#fa2d48;--pink-soft:rgba(250,45,72,.1);--green:#198754;--yellow:#a66c00;--blue:#2f65c8;--shadow:0 18px 55px rgba(28,28,40,.12);--glass:rgba(255,255,255,.82)}

/* Two-second LUMA launch screen. CSS fallback completes even if JS fails. */
#lumaSplash{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;
 background:var(--bg,#f7f7f9);color:#222036;
 animation:lumaSplashFinish 2s linear both;isolation:isolate;}
#lumaSplash .splash-center{display:flex;flex-direction:column;align-items:center;gap:16px;
 transform:translateY(-8px)}

#lumaSplash .splash-wordmark{font-size:42px;letter-spacing:.20em;font-weight:760;padding-left:.20em;text-shadow:0 2px 18px rgba(250,45,72,.12)}
#lumaSplash .splash-progress{position:absolute;left:50%;bottom:calc(45px + env(safe-area-inset-bottom));
 transform:translateX(-50%);width:100px;height:5px;border-radius:20px;background:rgba(20,19,38,.13);overflow:hidden}
#lumaSplash .splash-progress::after{content:"";display:block;height:100%;width:100%;border-radius:20px;
 background:var(--pink);transform-origin:left;animation:lumaProgress 2s linear forwards}
[data-theme="dark"] #lumaSplash{background:radial-gradient(ellipse at 14% 8%,rgba(172,31,122,.53),transparent 54%),
 radial-gradient(ellipse at 89% 25%,rgba(79,67,154,.61),transparent 54%),
 radial-gradient(ellipse at 60% 85%,rgba(18,92,109,.32),transparent 50%),linear-gradient(145deg,#17121f,#121320 65%,#111923);color:#fff}
[data-theme="dark"] #lumaSplash .splash-progress{background:rgba(255,255,255,.15)}
@keyframes lumaProgress{to{transform:scaleX(1)}from{transform:scaleX(0)}}
@keyframes lumaSplashFinish{0%,92%{opacity:1;visibility:visible}100%{opacity:0;visibility:hidden;pointer-events:none}}
@media(prefers-reduced-motion:reduce){#lumaSplash .splash-progress::after{animation:none;transform:scaleX(1)}}
/* Profile form and profile overview */
.profile-overview{display:flex;align-items:center;gap:16px;padding:16px 2px 20px}
.profile-avatar{width:58px;height:58px;flex-shrink:0;display:grid;place-items:center;overflow:hidden;border-radius:50%;
 border:1px solid var(--line);background:linear-gradient(145deg,#fde5f0,#eadcfa);color:#852a6b;font-size:22px;font-weight:730}
.profile-avatar--large{width:82px;height:82px;font-size:28px}
.profile-avatar--edit{width:112px;height:112px;margin:auto;cursor:pointer;position:relative}
.profile-avatar img{width:100%;height:100%;display:block;object-fit:cover}
.profile-avatar svg{width:53%;height:53%;fill:currentColor;opacity:.76}
#profileOpen{overflow:hidden;border-radius:50%}
#profileOpen.profile-has-avatar{background:var(--surface2);padding:2px}
#profileOpen .profile-top-avatar{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.profile-overview .profile-copy{min-width:0;flex:1}
.profile-overview .profile-name{font-size:20px;font-weight:720;letter-spacing:-.035em;overflow-wrap:anywhere}
.profile-form{display:flex;flex-direction:column;gap:16px;padding-bottom:20px}
.profile-form .profile-picture-group{display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px 0 8px;position:relative}
.profile-form .profile-picture-controls{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.profile-form .profile-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.profile-form .profile-field{display:flex;flex-direction:column;gap:8px;min-width:0}
.profile-form .profile-field.wide{grid-column:1/-1}
.profile-form .profile-field>label{font-size:12px;color:var(--muted);font-weight:640}
.profile-form input,.profile-form select{width:100%;min-width:0}
.profile-form .profile-consent{background:var(--surface2);border-radius:17px;padding:16px;display:flex;flex-direction:column;gap:12px}
.profile-consent label{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px}
.profile-consent label input{width:20px;height:20px;accent-color:var(--pink);flex:0 0 auto}
.profile-form .crop-zoom{width:min(240px,100%);display:none}
.profile-form .crop-zoom.visible{display:block}
.profile-form #profileCropCanvas{touch-action:none;display:none;border-radius:50%;width:112px;height:112px;border:1px solid var(--line);object-fit:cover;cursor:grab}
.profile-form #profileCropCanvas.visible{display:block}
.profile-form .profile-avatar.hidden-by-crop{display:none}
.sheet.profile-sheet{animation:profileSlideIn .32s cubic-bezier(.21,.84,.24,1);max-height:100dvh;
 height:100dvh;border-radius:0;padding-top:calc(16px + env(safe-area-inset-top));padding-bottom:calc(20px + env(safe-area-inset-bottom));}
.modalback.profile-backdrop{padding:0;background:var(--bg);backdrop-filter:none;align-items:stretch}
.profile-sheet .sheet-head{position:sticky;top:-16px;background:var(--surface);z-index:4;padding:8px 0 16px}
@keyframes profileSlideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@media(min-width:680px){.sheet.profile-sheet{width:min(520px,100%);margin-left:auto;box-shadow:0 2px 8px rgba(0,0,0,.08)}}
@media(prefers-reduced-motion:reduce){.sheet.profile-sheet{animation:none}}


/* ==========================================================
   LUMA DESIGN SYSTEM — Reference-matched gradient / glass UI
   The original feature styles are preserved and reskinned.
   ========================================================== */
:root{
 --bg:#10101b;--surface:rgba(28,27,44,.76);--surface2:rgba(255,255,255,.09);
 --surface3:rgba(255,255,255,.12);--text:#fcfbff;--muted:#b7b1c7;
 --line:rgba(255,255,255,.11);--pink:#0a84ff;--pink-soft:rgba(10,132,255,.19);
 --green:#65cf99;--blue:#91aefa;--shadow:0 10px 36px rgba(4,5,18,.15);
 --glass:rgba(31,29,48,.66);--radius:22px;
 --page-pink:#fa2d68;--page-purple:#9876ff;
 color-scheme:dark;
}
:root[data-theme="light"]{
 --bg:#fff6f9;--surface:rgba(255,255,255,.67);--surface2:rgba(255,255,255,.56);
 --surface3:rgba(255,255,255,.77);--text:#211a2c;--muted:#776d82;
 --line:rgba(255,255,255,.83);--pink:#007aff;--pink-soft:rgba(0,122,255,.13);
 --green:#329b81;--blue:#637cdb;--shadow:0 8px 28px rgba(89,61,98,.075);
 --glass:rgba(255,250,255,.67);color-scheme:light;
}
html{scroll-behavior:smooth}
html,body{min-height:100%;background:var(--bg);color:var(--text)}
html{min-height:100svh}
body{isolation:isolate;min-height:100dvh;padding-bottom:calc(117px + env(safe-area-inset-bottom));}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:var(--bg)!important}
[data-theme="light"] body::before{background:#fff!important}
body::after{content:none!important}
.app{max-width:860px;padding-inline:20px}
.topbar{position:sticky;top:0;z-index:20;background:transparent;border-bottom:0;box-shadow:none;
 backdrop-filter:none;-webkit-backdrop-filter:none;margin:0;padding:calc(12px + env(safe-area-inset-top)) 22px 5px;
 transition:padding .38s cubic-bezier(.22,1,.36,1),background .28s ease,box-shadow .28s ease;}
.topbar.compact{padding:calc(7px + env(safe-area-inset-top)) 22px 6px;background:var(--glass);
 backdrop-filter:blur(28px) saturate(170%);-webkit-backdrop-filter:blur(28px) saturate(170%);
 box-shadow:0 2px 8px rgba(0,0,0,.08);border-bottom:1px solid var(--line)}
.toprow{gap:12px;min-height:49px;align-items:center}
.brandmark.brandmark-luma{width:142px;height:43px;flex-shrink:1;border:0;border-radius:0;box-shadow:none;
 background:transparent;display:flex;align-items:center;justify-content:flex-start;overflow:visible}
.brandlogo-image{display:block;width:100%;height:auto;max-height:42px;object-fit:contain;object-position:left center;}
[data-theme="dark"]{--logo-filter:none}
.topbar.compact .brandmark.brandmark-luma{width:125px;height:39px;background:none;box-shadow:none;border-radius:0}
.brandtext[hidden]{display:none !important}
.header-actions{margin-left:auto;gap:8px}
.header-actions .iconbtn{width:49px;height:49px;flex:0 0 49px;border:1px solid var(--line);
 background:var(--glass);border-radius:50%;box-shadow:0 4px 14px rgba(0,0,0,.05);
 backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);transition:transform .24s cubic-bezier(.21,.9,.32,1),background .24s}
.header-actions .iconbtn:active{transform:scale(.90)}
.header-actions .iconbtn svg{width:24px;height:24px;stroke-width:1.75}
#notificationOpen{position:relative}
.notify-dot{position:absolute;right:11px;top:9px;width:6px;height:6px;border-radius:50%;background:#ff456e;
 border:1px solid var(--surface)}
.topbar .page-title{font-size:28px;margin:12px 0 4px;letter-spacing:-.05em;max-height:75px;overflow:hidden;
 transition:font-size .36s,margin .36s,max-height .36s,opacity .3s}
.topbar:has(+ .main .luma-home) .page-title{font-size:0;margin:0;max-height:0;opacity:0}
.topbar.compact .page-title{font-size:17px;margin:2px 0 0;max-height:24px}
.topbar.compact:has(+ .main .luma-home) .page-title{font-size:0;margin:0;max-height:0}
.main{padding-top:8px}
.card{border:1px solid var(--line);border-radius:23px;background:var(--surface);
 backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%);
 box-shadow:var(--shadow);padding:16px;overflow:hidden;}
.card+.card{margin-top:16px}
.section-head{margin:24px 0 12px}.section-head h2{font-size:17px;letter-spacing:-.038em}
.primary{background:linear-gradient(100deg,#ff5b87 0%,#ff3c77 52%,#fa2d68 100%);
 border:1px solid rgba(255,255,255,.20);color:white;border-radius:15px;
 box-shadow:0 2px 8px rgba(0,0,0,.08);transition:transform .22s,box-shadow .25s,filter .25s}
.primary:active{transform:scale(.975);filter:brightness(.97)}
.secondary,.pill{background:var(--surface2);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
 transition:background .24s,transform .22s,box-shadow .22s}
.secondary:active,.pill:active{transform:scale(.97)}
.seg{background:rgba(100,88,125,.09);border:1px solid var(--line);border-radius:17px;padding:4px;}
.seg button{border-radius:13px;transition:background .25s,color .25s,box-shadow .25s,transform .23s}
.seg button.active{background:var(--surface3);box-shadow:0 3px 12px rgba(23,15,41,.08);color:var(--text)}
input,textarea,select{accent-color:var(--pink)}
textarea,.field,input[type=text],input[type=number],input[type=password],input[type=time],input[type=date],input[type=email],select{background:var(--surface2);border:1px solid var(--line);border-radius:14px}
.iconbtn{background:var(--surface2);border-color:var(--line);transition:transform .22s,background .22s}
.iconbtn:active{transform:scale(.91)}
.bottomnav{width:min(510px,calc(100% - 32px));bottom:calc(12px + env(safe-area-inset-bottom));height:73px;padding:8px;
 border:1px solid var(--line);border-radius:25px;background:var(--glass);
 box-shadow:0 2px 8px rgba(0,0,0,.08), inset 0 1px rgba(255,255,255,.11);
 backdrop-filter:blur(30px) saturate(175%);-webkit-backdrop-filter:blur(30px) saturate(175%);isolation:isolate}
.nav-slider{pointer-events:none;position:absolute;z-index:-1;left:7px;top:7px;bottom:7px;
 width:calc((100% - 14px)/5);border:1px solid rgba(250,45,104,.09);
 border-radius:19px;background:linear-gradient(140deg,rgba(254,115,158,.23),rgba(251,43,104,.13));
 transform:translateX(calc(var(--nav-index,0)*100%));
 transition:transform .43s cubic-bezier(.19,.95,.25,1);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.navitem{position:relative;z-index:1;gap:4px;padding:8px 2px;border-radius:18px;transition:color .22s,transform .32s;background:transparent!important;min-width:0}
.navitem svg{width:23px;height:23px;transition:transform .32s cubic-bezier(.2,.9,.26,1),fill .27s}
.navitem.active{color:var(--pink)}
.navitem.active svg{transform:translateY(-2px) scale(1.06)}
.navitem:active svg{transform:scale(.84)}
.navitem span{font-size:11px;white-space:nowrap;letter-spacing:-.02em}
.fab{left:50%;right:auto;bottom:calc(101px + env(safe-area-inset-bottom));width:min(505px,calc(100% - 36px));
 transform:translateX(-50%);justify-content:center;border-radius:15px;min-height:49px;background:linear-gradient(105deg,#ff6286,#ff3c71 55%,#f92a68);
 box-shadow:0 2px 8px rgba(0,0,0,.08);font-size:15px;transition:filter .2s,box-shadow .24s}
.fab:active{filter:brightness(.94)}
/* Shared glass style across Calendar, Memories, Documents and full-screen settings */
.calendar-head .iconbtn{background:var(--surface2)}
.daycell{border-radius:13px;background:rgba(100,90,126,.07);transition:transform .18s,background .2s}
.daycell.chosen{background:var(--pink);color:#fff}.daycell:active{transform:scale(.92)}
.gallery-grid{gap:4px}.media-tile{border-radius:8px}.duration{background:rgba(10,8,18,.58);border-radius:7px}
.searchbox,.memories-selector,.selectionbar{background:var(--glass);border-color:var(--line);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px)}
.modalback{background:rgba(10,8,25,.40);backdrop-filter:blur(19px);-webkit-backdrop-filter:blur(19px)}
.sheet{background:var(--surface);border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.08);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px)}
.sheet.profile-sheet{background:var(--bg);border:0;box-shadow:none}
.modalback.profile-backdrop{background:var(--bg)}
.profile-sheet .sheet-head{background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:15px;padding:16px 8px}
.profile-overview{padding:24px 12px 24px;gap:20px}.profile-avatar{border:2px solid rgba(255,255,255,.6);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.settings-list,.profile-form .profile-consent{border-radius:22px;overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.setting-row{background:transparent;border-bottom:1px solid var(--line);}
.setting-icon{background:var(--pink-soft);color:var(--pink);border-radius:13px}
.setting-copy strong{letter-spacing:-.02em}
.credit{color:var(--muted);font-size:11px;text-align:center;line-height:1.6;padding:24px 16px 32px}
.profile-form .profile-consent{padding:16px}
.profile-form .profile-avatar--edit{box-shadow:0 2px 8px rgba(0,0,0,.08)}
/* The redesigned reference has a clean top and tiny glass outlines. */
.luma-home{display:flex;flex-direction:column;gap:16px;padding-bottom:12px}
.luma-stories{display:flex;align-items:flex-start;gap:12px;overflow-x:auto;padding:12px 1px 8px;scrollbar-width:none;scroll-snap-type:x proximity;}
.luma-stories::-webkit-scrollbar{display:none}
.story-cell{width:67px;min-width:67px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;scroll-snap-align:start}
.story-bubble{border-radius:50%;width:60px;height:60px;padding:4px;border:1.5px solid #ff5888;position:relative;
 background:linear-gradient(150deg,#ff6e91,#e43777);box-shadow:0 4px 11px rgba(243,64,119,.08);
 display:grid;place-items:center;overflow:hidden;transition:transform .28s cubic-bezier(.2,.9,.2,1),box-shadow .3s}
.story-bubble img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid var(--bg)}
.story-bubble:active{transform:scale(.91)}
.story-bubble:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
.story-bubble.add-bubble{background:rgba(246,178,202,.25);border:1px solid rgba(250,45,104,.1);font-size:28px;color:var(--text);font-weight:300}
.story-cell .story-name{font-size:11px;max-width:72px;line-height:1.25;color:var(--text);text-overflow:ellipsis;white-space:nowrap;overflow:hidden}
.story-empty{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,rgba(251,74,129,.18),rgba(105,101,225,.17));font-size:12px;font-weight:800;color:var(--pink)}
.luma-chart-card{padding:16px 16px 12px;min-height:223px}
.luma-chart-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px}
.luma-chart-head h2{font-size:16px;font-weight:740;letter-spacing:-.035em;margin:0}
.luma-chart-card .seg{margin:8px 0 12px}.luma-chart-card .seg button{font-size:12px;padding:8px}
.luma-chart-area{position:relative;display:flex;height:139px;gap:8px;align-items:stretch;padding-top:4px}
.luma-chart-faces{width:18px;display:flex;flex-direction:column;justify-content:space-between;padding:4px 0 16px;color:var(--pink)}
.luma-chart-faces svg{width:15px;height:15px;fill:var(--pink)}
.luma-bars{flex:1;display:flex;align-items:flex-end;gap:2px;min-width:0;position:relative;padding:8px 0 20px;
 background:repeating-linear-gradient(to top,transparent 0,transparent calc(33.33% - 1px),rgba(255,255,255,.055) calc(33.33% - 1px),rgba(255,255,255,.055) 33.33%)}
[data-theme="light"] .luma-bars{background:repeating-linear-gradient(to top,transparent 0,transparent calc(33.33% - 1px),rgba(158,115,151,.06) calc(33.33% - 1px),rgba(158,115,151,.06) 33.33%)}
.moodbar-col{height:100%;flex:1;min-width:0;display:flex;justify-content:flex-end;flex-direction:column;position:relative;align-items:center}
.moodbar{display:block;width:100%;min-width:2px;max-width:19px;border-radius:8px 8px 4px 4px;
 background:linear-gradient(180deg,#ffb7d0 0%,#ff689d 45%,#fa2d68 100%);
 box-shadow:0 2px 10px rgba(250,45,104,.13);transform-origin:bottom center;animation:lumaBarRise .6s cubic-bezier(.18,1,.3,1) both}
.moodbar-empty{height:3px;width:35%;border-radius:3px;background:rgba(188,153,193,.18)}
.luma-axis{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;color:var(--muted);font-size:11px}
.luma-chart-no-data{position:absolute;inset:25px 22px 30px;display:grid;place-items:center;font-size:12px;color:var(--muted);text-align:center;pointer-events:none}
@keyframes lumaBarRise{from{transform:scaleY(.12);opacity:.35}to{transform:scaleY(1);opacity:1}}
.luma-metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.luma-metric{position:relative;min-height:132px;padding:16px 16px 12px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between}
.luma-metric-label{font-size:12px;font-weight:730;letter-spacing:-.025em;margin-top:2px}
.luma-metric-icon{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:#f93c75;
 background:rgba(251,79,140,.14)}
.luma-metric-icon svg{width:25px;height:25px;fill:currentColor}
.luma-metric-number{font-size:28px;font-weight:800;letter-spacing:-.055em;line-height:1}
.luma-metric-sub{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.4}
.luma-metric--short{min-height:119px}
.luma-metric--short .luma-metric-label{font-size:12px;margin-bottom:8px}
.luma-ring-small{width:49px;height:49px;position:absolute;top:12px;right:12px}
.luma-ring-small svg{width:100%;height:100%;transform:rotate(-90deg)}
.luma-ring-small circle{fill:none;stroke-width:6}
.luma-ring-small .ring-bg{stroke:rgba(189,157,185,.19)}
.luma-ring-small .ring-fill{stroke:var(--pink);stroke-linecap:round;stroke-dasharray:125.66;transition:stroke-dashoffset .7s cubic-bezier(.2,.9,.3,1)}
.luma-ring-small span{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:800}
.luma-stability-track{height:8px;min-width:92px;border-radius:20px;background:rgba(116,168,146,.15);overflow:hidden;margin:8px 0}
.luma-stability-value{height:100%;border-radius:20px;background:linear-gradient(90deg,#58d7a5,#329b82);transition:width .6s ease}
.luma-feelings{display:flex;align-items:center;gap:8px}
.luma-bubbles{width:64px;height:64px;position:relative;flex-shrink:0}
.luma-bubbles span{position:absolute;width:36px;height:36px;border-radius:50%;opacity:.7;mix-blend-mode:normal;border:1px solid rgba(255,255,255,.1)}
.luma-bubbles span:nth-child(1){background:#ff9ab5;top:3px;left:7px}
.luma-bubbles span:nth-child(2){background:#ffbc85;top:6px;right:4px}
.luma-bubbles span:nth-child(3){background:#8497fa;bottom:2px;left:14px}
.luma-feeling-list{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1;font-size:11px;color:var(--muted)}
.luma-feeling-list div{display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.luma-feeling-list i{width:5px;height:5px;flex-shrink:0;border-radius:50%;background:#f76b9b}
.luma-feeling-list div:nth-child(2) i{background:#ffb081}
.luma-feeling-list div:nth-child(3) i{background:#94a8ff}
.luma-home .home-bottom-link{padding:0 1px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:1px}
.luma-home .home-bottom-link strong{font-size:13px}
.luma-home .home-bottom-link button{font-size:12px}
.planner-stack{margin:24px 0 4px}
.planner-title{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px}
.planner-title h2{font-size:17px;letter-spacing:-.03em;margin:0}
.planner-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.planner-row:last-child{border-bottom:0}
.planner-check{width:25px;height:25px;display:grid;place-items:center;flex-shrink:0;border-radius:50%;border:1.5px solid var(--pink);background:transparent;color:white}
.planner-check.done{background:var(--pink)}
.planner-note-preview{white-space:pre-wrap;word-break:break-word;line-height:1.45}
.planner-row .planner-delete{margin-left:auto;border:0;background:transparent;color:var(--muted);font-size:22px;padding:8px}
/* Splash: exact final black/white logo, two seconds, abstract pastel sweep */
#lumaSplash{z-index:110;display:flex;align-items:center;justify-content:center;overflow:hidden;
 background:radial-gradient(ellipse 90% 55% at 94% 13%,#ffe4cf 0%,transparent 65%),
 radial-gradient(ellipse 82% 68% at 2% 10%,#aecbff 0%,transparent 67%),
 radial-gradient(ellipse 105% 63% at 16% 79%,#ffc8c9 0%,transparent 70%),
 radial-gradient(ellipse 85% 75% at 86% 94%,#b0a2ff 0%,transparent 73%),#f7e5f6;
 color:#191320}
#lumaSplash::before{content:"";position:absolute;width:165%;height:120%;top:-8%;left:-30%;pointer-events:none;
 background:linear-gradient(155deg,transparent 34%,rgba(255,255,255,.32) 39%,transparent 47%,rgba(255,255,255,.2) 60%,transparent 70%);
 border-radius:44%;transform:rotate(-14deg);filter:blur(12px);animation:splashWaves 2s ease-in-out both}
[data-theme="dark"] #lumaSplash{
 background:radial-gradient(ellipse 83% 55% at 9% 75%,rgba(255,159,102,.80),transparent 68%),
 radial-gradient(ellipse 80% 55% at 92% 10%,rgba(14,54,116,.74),transparent 72%),
 radial-gradient(ellipse 64% 44% at 12% 9%,rgba(109,77,169,.65),transparent 80%),
 radial-gradient(ellipse 80% 55% at 74% 97%,rgba(105,68,176,.8),transparent 72%),linear-gradient(160deg,#111534,#141b42 65%,#2a1746);color:#fff}
.splash-center{z-index:1;display:flex;flex-direction:column;align-items:center;gap:12px;transform:translateY(-6%)}
.splash-face{width:min(90px,24vw);height:auto;object-fit:contain;filter:drop-shadow(0 3px 3px rgba(0,0,0,.03))}
.splash-word-image{width:min(173px,47vw);height:auto;object-fit:contain}
.splash-progress{z-index:1;bottom:calc(52px + env(safe-area-inset-bottom));height:4px;width:142px;border-radius:20px;background:rgba(255,255,255,.50)}
#lumaSplash .splash-progress::after{background:rgba(255,255,255,.95);animation-duration:2s}
[data-theme="dark"] #lumaSplash .splash-progress{background:rgba(255,255,255,.18)}
@keyframes splashWaves{0%{transform:rotate(-16deg) translateX(-5%);opacity:.6}100%{transform:rotate(-11deg) translateX(3%);opacity:1}}
/* reduced motion controls, while preserving functional screen transition */
@media(prefers-reduced-motion:reduce){
 html{scroll-behavior:auto!important}
 .nav-slider,.navitem,.card,.primary,.secondary,.iconbtn,.moodbar,.fab,.splash-center{transition:none!important;animation:none!important}
 #lumaSplash::before{animation:none!important}
}
:root[data-motion="off"] *, :root[data-motion="off"] *::before, :root[data-motion="off"] *::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}

:root[data-glass="off"] .bottomnav{background:var(--bg)}
@media(max-width:375px){.brandmark.brandmark-luma{width:125px}.topbar{padding-inline:16px}.header-actions{gap:8px}.header-actions .iconbtn{height:46px;width:46px;flex-basis:46px}.luma-stories{gap:8px}.story-cell{min-width:63px;width:63px}.story-bubble{width:57px;height:57px}.luma-metric{padding:12px 12px}.luma-ring-small{right:9px;top:11px;width:43px;height:43px}}

/* ===== iOS hareket sistemi ===== */
:root{--ios-ease:cubic-bezier(.32,.72,0,1);--ios-dur:.35s}
@keyframes iosPushIn{from{transform:translate3d(100%,0,0)}to{transform:translate3d(0,0,0)}}
@keyframes iosPushOut{from{transform:translate3d(0,0,0)}to{transform:translate3d(100%,0,0)}}
.modalback{background:transparent!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;align-items:stretch!important;justify-content:flex-end!important;padding:0!important;animation:none!important;inset:0;overflow:hidden!important}
.modalback .sheet,.modalback .sheet.full,.modalback .sheet.profile-sheet{position:fixed!important;top:0!important;right:0!important;bottom:0!important;left:auto!important;width:100%!important;max-width:100%!important;height:100dvh!important;max-height:100dvh!important;margin:0!important;border:0!important;border-radius:0!important;padding:calc(14px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom))!important;box-shadow:none!important;background:var(--sheet-fill)!important;backdrop-filter:blur(40px) saturate(160%)!important;-webkit-backdrop-filter:blur(40px) saturate(160%)!important;overflow-y:auto;overscroll-behavior:contain;will-change:transform;animation:iosPushIn var(--ios-dur) var(--ios-ease) backwards!important}
.modalback.is-closing{pointer-events:none}
.modalback.is-closing .sheet{animation:iosPushOut var(--ios-dur) var(--ios-ease) forwards!important}
@media(min-width:680px){.modalback .sheet,.modalback .sheet.full,.modalback .sheet.profile-sheet{width:min(620px,100%)!important;margin-left:auto!important;border-radius:24px 0 0 24px!important;border-left:1px solid var(--line)!important}}
.viewer{animation:iosPushIn var(--ios-dur) var(--ios-ease) backwards}
.viewer.is-closing{animation:iosPushOut var(--ios-dur) var(--ios-ease) forwards!important}
.topbar,.navitem,.nav-slider,.card,.primary,.secondary,.iconbtn,.fab,.moodbar,.toggle,.closebtn,.media-tile,.page-title,.brandmark,.planner-row{transition-timing-function:var(--ios-ease)!important;transition-duration:var(--ios-dur)!important}
#lumaSplash .splash-progress{display:none!important}
.brandmark.brandmark-luma,.topbar.compact .brandmark.brandmark-luma{width:auto!important;height:auto!important;min-width:0;flex:0 0 auto;overflow:visible!important;padding:0}

.muted,.small.muted{color:rgba(60,56,80,.78)}

.luma-stories .story-bubble,.story-bubble.add-bubble,.story-cell{box-shadow:none!important}

/* ===== v27: sade arama kutusu ===== */
.searchbox{background:var(--surface2)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;box-shadow:none!important;border:0!important;border-radius:999px!important}
.searchbox input,.searchbox input:focus{background:transparent!important;border:0!important;box-shadow:none!important}

/* ===== v28 ===== */
.searchbox input:not([type=checkbox]):not([type=range]){background:transparent!important;border:0!important;border-radius:0!important;box-shadow:none!important;outline:none!important}
#notificationOpen{position:relative}
#notificationOpen::before,#notificationOpen::after{display:none!important}
.bell-badge{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 4px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;line-height:1;box-shadow:0 0 0 2px var(--bg);pointer-events:none}
.bell-badge[hidden]{display:none}

/* ===== v30: seç, üç çizgi menü, yüzen oluştur düğmesi ===== */
.title-row{flex-wrap:wrap;row-gap:8px}
.title-row .memories-selector{margin-left:auto}
.sel-actions{position:relative;display:flex;align-items:center;gap:8px;margin-left:auto;height:38px;flex:0 0 auto}
.sel-btn{position:relative;height:36px;padding:0 16px;border-radius:999px;border:0;background:var(--glass-l);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow);font-size:15px;font-weight:650;color:var(--pink);transition:transform var(--ios-dur) var(--ios-ease)}
.sel-actions.has-sel .sel-btn,.sel-actions.in-mode.has-sel .sel-btn{transform:translateX(-44px)}
.sel-menu-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--glass-edge);background:var(--glass-l);box-shadow:var(--glass-shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;opacity:0;transform:scale(.4);pointer-events:none;transition:opacity var(--ios-dur) var(--ios-ease),transform var(--ios-dur) var(--ios-ease)}
.sel-actions.has-sel .sel-menu-btn{opacity:1;transform:scale(1);pointer-events:auto}
.sel-menu-btn span{display:block;width:16px;height:2px;border-radius:2px;background:var(--text)}
.sel-pop{position:fixed;z-index:200;min-width:180px;padding:8px;border-radius:18px;background:var(--sheet-fill);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--glass-edge);box-shadow:0 2px 8px rgba(0,0,0,.08);transform-origin:top right;opacity:0;transform:scale(.85);transition:opacity var(--ios-dur) var(--ios-ease),transform var(--ios-dur) var(--ios-ease)}
.sel-pop.open{opacity:1;transform:scale(1)}
.sel-pop.closing{opacity:0;transform:scale(.85)}
.sel-pop button{display:block;width:100%;text-align:left;padding:12px 16px;border:0;background:transparent;border-radius:12px;font-size:16px;font-weight:550;color:var(--text)}
.sel-pop button:active{background:rgba(127,127,127,.14)}
.sel-pop button.danger{color:var(--red)}
.doc-card{position:relative}
.doc-card.doc-sel .row{padding-left:32px}
.doc-card .tile-check{position:absolute;left:14px;top:50%;transform:translateY(-50%)}
.doc-create-fab{position:fixed;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:40;height:46px;padding:0 24px;border-radius:999px;border:0;background:linear-gradient(145deg,#ff5f73,var(--pink));color:#fff;font-weight:700;font-size:16px;box-shadow:0 2px 8px rgba(0,0,0,.08)}

/* ===== v31: sol Seç, sağ üç çizgi (aktif seçimde) ===== */
.sel-left{flex:0 0 auto;display:flex;align-items:center;margin-right:2px}
.sel-right{flex:0 0 auto;display:flex;align-items:center;margin-left:auto}
.sel-btn{height:34px;padding:0 16px;border-radius:999px;border:1px solid rgba(255,255,255,.75);background:rgba(255,255,255,.52);backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);box-shadow:0 2px 8px rgba(0,0,0,.08), inset 0 1px 0 rgba(255,255,255,.85);font-size:15px;font-weight:600;color:var(--text);transition:background var(--ios-dur) var(--ios-ease)}
[data-theme="dark"] .sel-btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.18);box-shadow:0 2px 8px rgba(0,0,0,.08), inset 0 1px 0 rgba(255,255,255,.12)}
.sel-left.in-mode .sel-btn{background:rgba(255,255,255,.7)}
[data-theme="dark"] .sel-left.in-mode .sel-btn{background:rgba(255,255,255,.2)}
.sel-menu-btn{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.75);background:rgba(255,255,255,.52);backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);box-shadow:0 2px 8px rgba(0,0,0,.08), inset 0 1px 0 rgba(255,255,255,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;opacity:0;transform:scale(.4);pointer-events:none;transition:opacity var(--ios-dur) var(--ios-ease),transform var(--ios-dur) var(--ios-ease)}
[data-theme="dark"] .sel-menu-btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.18);box-shadow:0 2px 8px rgba(0,0,0,.08), inset 0 1px 0 rgba(255,255,255,.12)}
.sel-right.has-sel .sel-menu-btn{opacity:1;transform:scale(1);pointer-events:auto}
.sel-menu-btn span{display:block;width:16px;height:2px;border-radius:2px;background:var(--text)}
.title-row .page-title{flex:0 1 auto}

/* ===== v32: sağda üç çizgi daire, menü: Seç / Tümünü seç / Dışa aktar / Sil ===== */
.sel-right{flex:0 0 auto;display:flex;align-items:center;margin-left:auto}
.sel-menu-btn{opacity:1!important;transform:none!important;pointer-events:auto!important}
.sel-pop button:disabled{opacity:.38;pointer-events:none}
.sel-btn{display:none}

/* ===== v33: arama satırında tek sıra ===== */
.row:has(> .searchbox){flex-wrap:nowrap!important;gap:8px}
.searchbox{min-width:0}
.sel-right.in-search{margin-left:0;margin-top:0}
.sel-right.in-search .sel-menu-btn{width:44px;height:44px}

/* ===== v34: çöp kutusu ===== */
.trash-link{display:block;width:100%;margin:8px 0 0;padding:16px;border:0;background:transparent;color:var(--red);font-size:16px;font-weight:600}
.trash-list{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.trash-row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--glass-l);border:1px solid var(--glass-edge)}
.trash-thumb{width:52px;height:52px;border-radius:14px;overflow:hidden;display:grid;place-items:center;background:var(--surface3);flex:0 0 auto;font-size:20px}
.trash-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.trash-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.trash-info strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trash-acts{display:flex;flex-direction:column;gap:8px}
.trash-acts button{padding:8px 12px;font-size:13px;border-radius:999px}
.trash-acts .danger{color:var(--red)}

/* ===== v35: çöp kutusu menüsü ve seçim ===== */
.trash-top{display:flex;align-items:flex-start;gap:12px}
.trash-menu-btn{flex:0 0 auto;opacity:1!important;transform:none!important;pointer-events:auto!important;width:44px;height:44px}
.trash-row.trash-selmode{cursor:pointer}
.trash-row .tile-check{position:static;transform:none;flex:0 0 auto;width:24px;height:24px}
.trash-row.trash-on{border-color:rgba(250,45,72,.5)}

.sel-pop{background:rgba(250,248,252,.97)!important;backdrop-filter:blur(30px) saturate(180%)!important;-webkit-backdrop-filter:blur(30px) saturate(180%)!important}
[data-theme="dark"] .sel-pop{background:rgba(28,25,44,.97)!important}

/* ===== v36: belge oluştur artı düğmesi (alt bar yüzeyi, hafif vurgu) ===== */
.doc-fab{position:fixed;right:18px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:40;width:58px;height:58px;border-radius:50%;padding:0;border:1px solid rgba(255,255,255,.7);background:linear-gradient(180deg,rgba(250,45,72,.16),rgba(250,45,72,.07)),linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,.22));backdrop-filter:blur(22px) saturate(200%) brightness(1.05);-webkit-backdrop-filter:blur(22px) saturate(200%) brightness(1.05);box-shadow:0 2px 8px rgba(0,0,0,.08), inset 0 1px 0 rgba(255,255,255,.7), inset 0 -1px 0 rgba(255,255,255,.2);color:var(--pink);display:grid;place-items:center;transition:opacity var(--ios-dur) var(--ios-ease),transform var(--ios-dur) var(--ios-ease)}
[data-theme="dark"] .doc-fab{background:linear-gradient(180deg,rgba(250,45,72,.22),rgba(250,45,72,.1)),linear-gradient(180deg,rgba(40,36,64,.36),rgba(20,18,36,.22));border-color:rgba(255,255,255,.16);box-shadow:0 2px 8px rgba(0,0,0,.08), inset 0 1px 0 rgba(255,255,255,.12)}
.doc-fab svg{width:24px;height:24px;display:block}
.doc-fab:active{transform:scale(.92)}
body.modal-open .doc-fab{opacity:0;pointer-events:none}
.doc-create-fab{display:none!important}

body:not(.on-home) .toprow{display:none!important}

/* ===== v38: belge karşıya yükle ===== */
.sel-right .doc-up-btn{opacity:1!important;transform:none!important;pointer-events:auto!important;margin-right:8px}

/* ===== v39: sıralama menüsü, simge boyutu ===== */
.sel-right .doc-up-btn svg{width:17px;height:17px;display:block}
.sel-sep{height:1px;margin:8px 8px;background:var(--line)}

/* ===== v40: tüm profil simgeleri aynı mavi avatar ===== */
:root{--avatar-fill:linear-gradient(170deg,#3c3c42 0%,#2b2b31 50%,#1f1f24 100%)}
:root[data-theme="light"]{--avatar-fill:linear-gradient(170deg,#e9e9ee 0%,#d5d5dd 50%,#c2c2cc 100%)}
#profileOpen{background:var(--avatar-fill)!important;box-shadow:0 2px 8px rgba(0,0,0,.08)!important}
.profile-avatar,.apple-hero .profile-avatar,.profile-avatar--large,.profile-avatar--edit{background:var(--avatar-fill)!important;box-shadow:0 2px 8px rgba(0,0,0,.08)!important}
.profile-avatar svg,#profileOpen svg,.apple-hero .profile-avatar svg,.profile-top-avatar svg{fill:#fff!important}

/* ===== v41: anahtarlar, vurgu rengi (iOS paleti) ===== */
.accent-row .setting-copy{min-width:0;flex:1}
.accent-dots{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.accent-dot{width:30px;height:30px;border-radius:50%;border:0;padding:0;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);transition:box-shadow var(--ios-dur) var(--ios-ease),transform var(--ios-dur) var(--ios-ease)}
.accent-dot.on{box-shadow:0 0 0 2.5px var(--surface2), 0 0 0 4.5px currentColor;transform:scale(1.04)}
.accent-dot:not(.on){box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}

/* ===== v42: karşılama (onboarding), vurgu rengine bağlı primary ===== */
.primary{background:linear-gradient(100deg,color-mix(in srgb,var(--pink) 78%,#fff) 0%,var(--pink) 58%,color-mix(in srgb,var(--pink) 86%,#000) 100%)!important;box-shadow:0 2px 8px rgba(0,0,0,.08)!important}
#onboard{position:fixed;inset:0;z-index:900;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;padding:calc(env(safe-area-inset-top) + 14px) 0 calc(env(safe-area-inset-bottom) + 18px);transition:opacity .42s var(--ios-ease),transform .42s var(--ios-ease)}
#onboard.out{opacity:0;transform:scale(1.02)}
.onb-skip-wrap{display:flex;justify-content:flex-end;padding:0 20px;min-height:40px}
.onb-skip{border:0;background:transparent;color:var(--muted);font-size:16px;font-weight:600;padding:8px 4px;transition:opacity var(--ios-dur) var(--ios-ease)}
.onb-track{flex:1;display:flex;width:100%;transition:transform .55s var(--ios-ease);will-change:transform}
.onb-step{flex:0 0 100%;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 32px;box-sizing:border-box;overflow-y:auto}
.onb-step h2{font-size:28px;font-weight:750;letter-spacing:-.02em;margin:24px 0 12px}
.onb-step p{margin:0;font-size:16px;line-height:1.5;color:var(--muted);max-width:320px}
.onb-art{position:relative;width:240px;height:200px;display:grid;place-items:center}
.onb-step:not(.active) .onb-art *{animation-play-state:paused}
.onb-logo{width:210px;height:49px;background:var(--logo-ink);-webkit-mask-image:var(--logo-mask);mask-image:var(--logo-mask);transform:scale(.8);opacity:0}
.onb-step.active .onb-logo{animation:onbPop .7s var(--ios-ease) .15s forwards}
@keyframes onbPop{to{transform:scale(1);opacity:1}}
.onb-art-mood .ob{position:absolute;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:28px;color:#fff;opacity:0;transform:translateY(30px) scale(.6)}
.onb-art-mood .b1{left:24px;top:52px;background:linear-gradient(145deg,#34c759,#248a3d)}
.onb-art-mood .b2{left:89px;top:14px;background:linear-gradient(145deg,#ff9f0a,#c93400)}
.onb-art-mood .b3{left:154px;top:58px;background:linear-gradient(145deg,#0a84ff,#0060d0)}
.onb-step.active .onb-art-mood .ob{animation:onbFloat .8s var(--ios-ease) forwards}
.onb-step.active .onb-art-mood .b2{animation-delay:.12s}
.onb-step.active .onb-art-mood .b3{animation-delay:.24s}
@keyframes onbFloat{to{opacity:1;transform:translateY(0) scale(1)}}
.onb-line{position:absolute;left:0;bottom:6px;width:240px;height:90px;fill:none;stroke:var(--pink);stroke-width:4;stroke-linecap:round;stroke-dasharray:320;stroke-dashoffset:320}
.onb-step.active .onb-line{animation:onbDraw 1.1s var(--ios-ease) .35s forwards}
@keyframes onbDraw{to{stroke-dashoffset:0}}
.onb-art-memories .ph{position:absolute;width:118px;height:150px;border-radius:22px;background:linear-gradient(160deg,var(--pink),color-mix(in srgb,var(--pink) 45%,#fff));box-shadow:0 2px 8px rgba(0,0,0,.08);opacity:0;transform:translateY(40px) rotate(0deg)}
.onb-art-memories .p1{left:18px;top:24px;background:linear-gradient(160deg,#c6d3f3,#8ba2dc)}
.onb-art-memories .p2{left:60px;top:14px;background:linear-gradient(160deg,color-mix(in srgb,var(--pink) 60%,#fff),var(--pink))}
.onb-art-memories .p3{left:102px;top:34px;background:linear-gradient(160deg,#ffd27a,#ff9f0a)}
.onb-step.active .onb-art-memories .ph{animation:onbCard .7s var(--ios-ease) forwards}
.onb-step.active .p2{animation-delay:.1s}.onb-step.active .p3{animation-delay:.2s}
@keyframes onbCard{to{opacity:1;transform:translateY(0)}}
.onb-art-docs .row-ob{position:absolute;left:20px;right:20px;height:48px;border-radius:16px;background:var(--glass-l);border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow);opacity:0;transform:translateX(-30px)}
.onb-art-docs .r1{top:22px}.onb-art-docs .r2{top:78px}.onb-art-docs .r3{top:134px}
.onb-step.active .onb-art-docs .row-ob{animation:onbRow .6s var(--ios-ease) forwards}
.onb-step.active .r2{animation-delay:.12s}.onb-step.active .r3{animation-delay:.24s}
@keyframes onbRow{to{opacity:1;transform:translateX(0)}}
.onb-art-done{width:150px;height:150px}
.onb-art-done svg{width:150px;height:150px;fill:none;stroke:var(--pink);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.onb-art-done circle{stroke-dasharray:220;stroke-dashoffset:220}
.onb-art-done path{stroke-dasharray:60;stroke-dashoffset:60}
.onb-step.active .onb-art-done circle{animation:onbDraw2 .8s var(--ios-ease) forwards}
.onb-step.active .onb-art-done path{animation:onbDraw2 .5s var(--ios-ease) .6s forwards}
@keyframes onbDraw2{to{stroke-dashoffset:0}}
.onb-setup{justify-content:flex-start;padding-top:24px}
.onb-setup h2{margin:8px 0 4px}
.onb-small{font-size:15px!important}
.onb-field{width:100%;max-width:340px;text-align:left;margin-top:16px}
.onb-field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 8px 4px}
.onb-field input{width:100%;padding:12px 16px;border-radius:14px;font-size:16px}
.onb-accents{justify-content:flex-start;margin-top:4px}
.onb-bio{max-width:340px;width:100%;margin-top:16px}
.onb-foot{display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:16px}
.onb-dots{display:flex;gap:8px}
.onb-dots i{width:8px;height:8px;border-radius:99px;background:var(--line);transition:width .4s var(--ios-ease),background .4s var(--ios-ease)}
.onb-dots i.on{width:24px;background:var(--pink)}
.onb-next{min-width:130px;padding:16px 24px;border-radius:999px}

/* ===== v44: anahtarlar, cam kapalı, kutucuk gradyanı, dolgulu simgeler ===== */
:root[data-glass="off"]{--glass-l:var(--surface);--glass-blur:none;--sheet-fill:var(--bg)}
:root[data-glass="off"] .card,:root[data-glass="off"] .apple-group,:root[data-glass="off"] .settings-list,:root[data-glass="off"] .searchbox,:root[data-glass="off"] .sheet,:root[data-glass="off"] .modalback,:root[data-glass="off"] .toast,:root[data-glass="off"] .sel-pop{background:var(--surface)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;box-shadow:none!important}
:root[data-glass="off"] .bottomnav,:root[data-glass="off"] .nav-slider,:root[data-glass="off"] .secondary,:root[data-glass="off"] .iconbtn{background:var(--surface)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.setting-icon,.apple-tile{background:linear-gradient(160deg,color-mix(in srgb,var(--tile,#8e8e93) 62%,#fff) 0%,var(--tile,#8e8e93) 100%)!important;border-radius:9px!important}
.setting-icon svg,.apple-tile svg{width:19px!important;height:19px!important;fill:#fff!important;stroke:none!important;display:block}
.accent-row{align-items:flex-start!important}
.accent-row>.setting-icon{margin-top:1px}

/* ===== v45: profil kartı, uygulama kilidi profilden kaldırıldı ===== */
.profile-card{display:flex;align-items:center;gap:16px;width:100%;padding:16px;text-align:left;border:0;color:inherit;cursor:pointer}
.pc-avatar{flex:0 0 auto;width:64px;height:64px;display:block}
.pc-avatar .profile-avatar{width:64px!important;height:64px!important;margin:0!important;font-size:22px;box-shadow:0 2px 8px rgba(0,0,0,.08)!important}
.pc-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.pc-info strong{font-size:17px;font-weight:700;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile-card .apple-chev{width:16px;height:16px;flex:0 0 auto;fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:.55}
.lock-now-btn{width:100%;padding:16px;border-radius:18px;font-size:16px;font-weight:600;color:var(--pink);margin-top:16px}

/* ===== v47: kilit ekranı tuş takımı, daire doldurma, ayarlar ===== */
.lockscreen .lock-title{margin:4px 0 4px}
.pin-dots{display:flex;justify-content:center;gap:20px;margin:24px 0 8px;min-height:18px}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--pink);background:transparent;transform:scale(1);transition:background var(--ios-dur) var(--ios-ease),transform var(--ios-dur) var(--ios-ease)}
.pin-dots i.fill{background:var(--pink)}
.pin-dots i.pop{animation:pinPop .42s var(--ios-ease)}
@keyframes pinPop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.lock-err{min-height:20px;font-size:15px;color:var(--red);margin-bottom:8px;text-align:center}
.lock-pad{display:grid;grid-template-columns:repeat(3,76px);gap:16px 24px;justify-content:center;margin-top:12px}
.lock-pad .pad-key{width:76px;height:76px;border-radius:50%;border:1px solid var(--glass-edge);background:var(--glass-l);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);box-shadow:var(--glass-shadow);font-size:28px;font-weight:500;color:var(--text);transition:transform .15s var(--ios-ease),background var(--ios-dur) var(--ios-ease)}
.lock-pad .pad-key:active{transform:scale(.92);background:color-mix(in srgb,var(--pink) 22%,transparent)}
.lock-forgot{margin-top:24px;border:0;background:transparent;color:var(--pink);font-size:15px;font-weight:600;padding:8px 12px}
.lock-pad[hidden],.pin-dots[hidden],.lock-forgot[hidden],#forgotBox[hidden]{display:none!important}
#forgotBox{width:100%;max-width:320px;display:flex;flex-direction:column;gap:12px;margin-top:20px}
.lock-q{margin:0;font-size:17px;font-weight:600;text-align:center}
.lock-ans{width:100%;padding:12px 16px;border-radius:14px;font-size:16px;text-align:center}
.lock-fbtns{display:flex;gap:12px}
.lock-fbtns button{flex:1;padding:12px;border-radius:14px}

/* ===== v49: gizli anılar, kaydet pasif, üç çizgi ===== */
.primary:disabled{opacity:.42;filter:saturate(.4);box-shadow:none!important;cursor:default}
.secret-zone{flex:1;min-height:240px}
.hid-top{display:flex;align-items:center;gap:12px}
.hid-seg{flex:1;display:flex;overflow-x:auto}
.hid-seg button{flex:0 0 auto}
.hid-top .sel-menu-btn{opacity:1!important;transform:none!important;pointer-events:auto!important;flex:0 0 auto;width:44px;height:44px}
.hid-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.hid-tile{position:relative;aspect-ratio:1/1;border-radius:16px;overflow:hidden;border:0;padding:0;background:var(--surface3)}
.hid-tile img,.hid-tile video{width:100%;height:100%;object-fit:cover;display:block}
.hid-play{position:absolute;left:6px;bottom:6px;color:#fff;font-size:12px;background:rgba(0,0,0,.45);border-radius:99px;padding:2px 8px}
.hid-tile.on{box-shadow:0 0 0 3px var(--pink)}
.hid-check{position:absolute;right:6px;top:6px;width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.25);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.hid-check.on{background:var(--pink);border-color:var(--pink)}
.hid-list{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.hid-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;padding:16px}
.hid-row.on{box-shadow:0 0 0 2px var(--pink)}
.hid-row .hid-check{position:static;border-color:var(--pink)}
.hid-txt{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.hid-txt strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== stage1: oval kutular, profil düğmeleri, bildirim ===== */
input:not([type=checkbox]):not([type=range]):not([type=radio]),select{border-radius:999px!important;max-width:100%;min-width:0;box-sizing:border-box}
textarea{border-radius:18px!important}
.profile-form .modal-actions{justify-content:center;gap:12px;margin-top:16px}
.profile-form .modal-actions button{min-width:132px;padding:12px 20px;border-radius:999px!important;font-size:16px;font-weight:600;line-height:1.1;flex:0 0 auto}
.setting-row.row-tap{cursor:pointer}
.notice-clear{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));z-index:260;padding:12px 24px;border-radius:999px;border:1px solid var(--glass-edge);background:var(--glass-l);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);box-shadow:var(--glass-shadow);color:var(--red);font-weight:600;font-size:16px;animation:noticeIn .35s cubic-bezier(.32,.72,0,1)}
@keyframes noticeIn{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
[data-notice-card]{will-change:transform}

/* ===== stage1b: belge filtresi, tarih kutuları ===== */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fcell{display:flex;flex-direction:column;gap:8px;min-width:0}
.fcell input[type=date]{width:100%;min-width:0}

/* ===== stage2: klasörler ve dışa aktarma ===== */
.dfolders{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.dfold{display:flex;align-items:center;gap:12px;padding:12px;border-radius:20px;border:1px solid var(--glass-edge);background:var(--glass-l);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);box-shadow:var(--glass-shadow);text-align:left;color:var(--text);min-width:0;transition:box-shadow var(--ios-dur) var(--ios-ease),transform var(--ios-dur) var(--ios-ease)}
.dfold:active{transform:scale(.97)}
.dfold.on{box-shadow:0 0 0 2px var(--fc), var(--glass-shadow)}
.dfold-ico{width:36px;height:36px;border-radius:11px;background:var(--fc,#8e8e93);display:grid;place-items:center;color:#fff;flex:0 0 auto;font-size:20px;font-weight:600}
.dfold-ico svg{width:20px;height:20px;fill:#fff}
.dfold-txt{display:flex;flex-direction:column;min-width:0}
.dfold-txt strong{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dfold-add .dfold-ico{background:var(--pink)}
.dmove{display:flex;align-items:center;gap:12px;width:100%;padding:12px;text-align:left;border:0;color:var(--text);font-size:16px;margin-bottom:8px}
.dmove .dfold-ico{width:44px;height:44px}
.file-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px 12px;margin:8px 0 20px}
.file-tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;padding:0;border:0;background:transparent;color:var(--text);text-align:center}
.file-tile-art{position:relative;display:grid;place-items:center;width:100%;max-width:72px;aspect-ratio:1;border-radius:19px;background:var(--file-color,#5856D6);background:linear-gradient(145deg,color-mix(in srgb,var(--file-color,#5856D6) 78%,white),var(--file-color,#5856D6) 72%,color-mix(in srgb,var(--file-color,#5856D6) 75%,black));color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 5px 12px rgba(0,0,0,.16);overflow:hidden;transition:transform .18s var(--ios-ease)}
.file-tile:active .file-tile-art{transform:scale(.93)}
.file-tile-art svg{width:44px;height:44px;fill:rgba(255,255,255,.96);filter:drop-shadow(0 1px 1px rgba(0,0,0,.16))}
.file-tile-name{display:-webkit-box;width:100%;max-width:88px;overflow:hidden;text-overflow:ellipsis;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:11px;font-weight:550;line-height:1.25;overflow-wrap:anywhere}
.file-tile-check{position:absolute;right:4px;top:4px;display:grid;place-items:center;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;font-weight:700;box-shadow:0 1px 4px #0005}
.file-tile.selected .file-tile-art{outline:2px solid var(--accent);outline-offset:2px}
.file-tile.media-art{background:var(--surface3)}
.file-tile-art.media-art img,.file-tile-art.media-art video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.file-tile-art.media-art .hid-play{z-index:1}
.doc-search-results{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px 12px;margin:8px 0 20px}
.doc-search-results:empty{display:none}
.file-tile.search-best .file-tile-art{outline:2px solid var(--accent);outline-offset:3px}
.docs-list.is-hidden{display:none}
.file-tile.unsupported-file .file-tile-art{background:linear-gradient(145deg,var(--unsupported-file-light),var(--unsupported-file-dark));color:var(--unsupported-file-ink)}
.file-tile.unsupported-file .file-tile-art svg{width:auto;height:auto;max-width:50px;fill:none;filter:none;font-size:12px}
.file-extension-mark{font-size:12px;font-weight:750;letter-spacing:.02em;text-transform:uppercase;max-width:52px;overflow:hidden;text-overflow:ellipsis}
.file-tile.unsupported-file{--file-color:var(--unsupported-file-light)}
:root{--unsupported-file-light:#B7BCC5;--unsupported-file-dark:#858B96;--unsupported-file-ink:#fff}
[data-theme="dark"]{--unsupported-file-light:#646B76;--unsupported-file-dark:#434953;--unsupported-file-ink:#F1F2F5}
.media-folder-tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:360px){.file-tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.file-tile-art{max-width:68px}}

/* ===== stage3: mesajlar ===== */
.msg-list{display:flex;flex-direction:column;gap:8px;padding:4px 2px 96px;min-height:40vh}
.msg-day{align-self:center;margin:12px 0 8px;font-size:12px;font-weight:600;color:var(--muted);background:var(--glass-l);border:1px solid var(--glass-edge);padding:4px 12px;border-radius:999px;backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur)}
.msg-row{display:flex;align-items:flex-end;gap:8px;justify-content:flex-end;width:100%}
.msg-row.on{background:color-mix(in srgb,var(--pink) 10%,transparent);border-radius:16px}
.msg-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--pink);display:grid;place-items:center;font-size:12px;color:#fff;flex:0 0 auto}
.msg-check.on{background:var(--pink)}
.msg-bubble{max-width:78%;padding:8px 12px 8px;border-radius:20px 20px 6px 20px;background:linear-gradient(160deg,color-mix(in srgb,var(--pink) 80%,#fff),var(--pink));color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08);display:flex;flex-direction:column;gap:4px;word-break:break-word}
.msg-bubble.image,.msg-bubble.video{padding:4px;border-radius:18px 18px 6px 18px}
.msg-bubble.document{min-width:190px;padding:10px 12px}
.msg-file-link{display:flex;align-items:center;gap:10px;min-width:0;border:0;padding:0;background:transparent;color:inherit;text-align:left;cursor:pointer}
.msg-file-icon{width:38px;height:38px;flex:0 0 auto;display:grid;place-items:center;border-radius:11px;background:rgba(255,255,255,.2);font-size:10px;font-weight:700;overflow:hidden}
.msg-file-icon svg{width:21px;height:21px;fill:currentColor}
.msg-file-label{min-width:0;display:flex;flex-direction:column;gap:2px}
.msg-file-label strong{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.msg-file-label span{font-size:11px;opacity:.78}
.msg-text{font-size:16px;line-height:1.35;white-space:pre-wrap}
.msg-img,.msg-vid{display:block;width:220px;max-width:70vw;border-radius:15px}
.msg-time{align-self:flex-end;font-size:11px;opacity:.8;padding:0 4px 2px}
.msg-compose{position:fixed;left:12px;right:12px;bottom:calc(98px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;z-index:50}
.msg-input{flex:1;min-width:0;height:44px;border-radius:999px!important;padding:0 16px;font-size:16px;border:1px solid var(--glass-edge);background:var(--glass-l);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);box-shadow:var(--glass-shadow)}
.msg-attach,.msg-send{width:44px;height:44px;border-radius:50%;border:1px solid var(--glass-edge);background:var(--glass-l);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);box-shadow:var(--glass-shadow);display:grid;place-items:center;color:var(--pink);flex:0 0 auto}
.msg-attach svg,.msg-send svg{width:20px;height:20px}
.msg-send{background:var(--pink);color:#fff;border-color:transparent}

/* ===== stage4: kişiler ===== */
.ct-letter{font-size:13px;font-weight:700;color:var(--muted);margin:16px 8px 8px}
.ct-row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;text-align:left;border:0;margin-bottom:8px;color:var(--text)}
.ct-row.on{box-shadow:0 0 0 2px var(--pink)}
.ct-av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;flex:0 0 auto;overflow:hidden}
.ct-av img{width:100%;height:100%;object-fit:cover}
.ct-av.big{width:96px;height:96px;font-size:28px;margin:0 auto 12px}
.ct-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ct-txt strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ct-score{font-size:13px;font-weight:700;color:var(--pink);min-width:30px;text-align:right}
.ct-add-fab{position:fixed;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:60;height:46px;padding:0 20px;border-radius:999px;border:1px solid var(--glass-edge);background:var(--glass-l);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);box-shadow:var(--glass-shadow);color:var(--pink);font-weight:700}
.ct-photo-row{display:flex;align-items:center;gap:16px}
.ct-photo-circle{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:22px;overflow:hidden}
.ct-photo-circle img{width:100%;height:100%;object-fit:cover}
.ct-photo-btns{display:flex;gap:12px}
.ct-plus,.ct-minus{width:40px;height:40px;border-radius:50%;border:0;color:#fff;font-size:22px;font-weight:700;display:grid;place-items:center}
.ct-plus{background:#34c759}.ct-minus{background:var(--red)}
.ct-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ct-grid input{min-width:0;width:100%;box-sizing:border-box;padding:12px 16px;border-radius:999px!important}
.ct-detail{display:flex;flex-direction:column;gap:16px}
.ct-score-card{text-align:center;display:flex;flex-direction:column;gap:2px}
.ct-score-card strong{font-size:34px;color:var(--pink)}
.ct-shortcuts{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.ct-sc{display:flex;align-items:center;justify-content:center;min-height:44px;padding:12px 12px;border:0;border-radius:999px!important;font-weight:600;color:var(--text);text-decoration:none;font-size:15px;margin:0;width:100%;box-sizing:border-box;text-align:center}

/* ===== stage4b: yakınlar, mesaj etiketi ===== */
.ct-rel{display:flex;gap:12px;overflow-x:auto;padding:8px 2px 12px}
.ct-relchip{display:flex;flex-direction:column;align-items:center;gap:8px;border:0;background:transparent;color:var(--text);font-size:13px;min-width:64px}
.ct-av.sm{width:52px;height:52px;font-size:17px}
.rel-row{display:flex;align-items:center;gap:12px;padding:12px 12px;border:0}
.rel-row input{margin-left:auto;width:22px;height:22px;accent-color:var(--pink)}
.ct-sugg{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.ct-tagchip{border:1px solid var(--glass-edge);background:var(--glass-l);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);color:var(--pink);font-size:13px;font-weight:600;padding:8px 12px;border-radius:999px}
.msg-inwrap{flex:1;min-width:0;position:relative;display:flex;flex-direction:column}
.msg-suggest{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.msg-mention{font-weight:700;text-decoration:underline;text-underline-offset:2px}
.msg-suggest:empty{display:none}

.ct-mood{display:flex;flex-direction:column;gap:8px;padding:16px}
.ct-emo{display:flex;gap:8px;flex-wrap:wrap}
.ct-emo span{font-size:13px;padding:4px 12px;border-radius:999px;background:color-mix(in srgb,var(--pink) 14%,transparent);color:var(--text)}
.msg-dupnote{font-size:12px;color:var(--muted);width:100%;margin-top:4px}

/* ===== stage5: regl takvimi ve stres ===== */
.cycle-card{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.cycle-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.cycle-btns button{flex:1 1 auto;padding:12px 16px;border-radius:999px;font-size:15px}
.stress-val{text-align:center;font-size:34px;color:var(--pink)}

/* ===== stage6: arka planlar, profil fotoğraf düğmesi, ruh sağlığı ===== */
#appBg{position:fixed;inset:0;z-index:-1;background:var(--appbg,var(--bg));transition:background .45s var(--ios-ease);pointer-events:none}
#lumaSplash,#lockscreen,#onboard{background:var(--appbg,var(--bg))!important}
.bg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.bg-tile{position:relative;aspect-ratio:9/16;border-radius:18px;border:2px solid transparent;overflow:hidden;padding:0;display:flex;align-items:flex-end;justify-content:center;color:var(--text);font-size:12px;font-weight:600}
.bg-tile span{background:var(--glass-l);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);padding:4px 8px;border-radius:999px;margin-bottom:8px;max-width:92%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bg-tile.on{border-color:var(--pink)}
.bg-default-tile{aspect-ratio:1/1;grid-column:auto;height:auto;background:linear-gradient(135deg,#ffffff 50%,#000000 50%)}
.bg-default-tile span{white-space:normal}
.bg-custom{position:relative}
.bg-custom.on .bg-tile{border-color:var(--pink)}
.bg-del{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:16px;line-height:1;display:grid;place-items:center}
.bg-preview{width:135px;margin:0 auto;border-radius:18px;overflow:hidden;aspect-ratio:9/16;border:1px solid var(--glass-edge)}
.bg-preview canvas{width:100%;height:100%;display:block}
.photo-toggle{width:44px;height:44px;border-radius:50%;border:0;color:#fff;font-size:28px;font-weight:600;line-height:1;background:#34c759;box-shadow:0 2px 8px rgba(0,0,0,.08);transition:background var(--ios-dur) var(--ios-ease),transform var(--ios-dur) var(--ios-ease)}
.photo-toggle.remove{background:var(--red);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.photo-toggle:active{transform:scale(.92)}
#profilePickPhoto,#profileRemovePhoto{display:none!important}
.profile-avatar img{animation:photoIn .45s var(--ios-ease)}
@keyframes photoIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.cond-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.cond-chip{padding:8px 12px;border-radius:999px;border:1px solid var(--glass-edge);background:var(--glass-l);color:var(--text);font-size:13px}
.cond-chip.on{background:color-mix(in srgb,var(--pink) 18%,transparent);border-color:var(--pink);color:var(--pink);font-weight:600}
.cond-box{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.cond-consent{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding:12px 16px;border-radius:18px;background:var(--glass-l);border:1px solid var(--glass-edge)}
.cond-consent input[type=checkbox]{-webkit-appearance:none!important;appearance:none!important;position:relative!important;width:51px!important;height:31px!important;border-radius:999px!important;background:#e9e9eb!important;border:0!important;margin:0!important;flex:0 0 auto;cursor:pointer;transition:background var(--ios-dur) var(--ios-ease)!important}
[data-theme="dark"] .cond-consent input[type=checkbox]{background:#39393b!important}
.cond-consent input[type=checkbox]::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15);transition:transform var(--ios-dur) var(--ios-ease)}
.cond-consent input[type=checkbox]:checked{background:#34c759!important}
.cond-consent input[type=checkbox]:checked::after{transform:translateX(20px)}

/* ===== stage7: gizli klasöre ekle, bildirim temizle konumu ===== */
.hid-add-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--glass-edge);background:var(--glass-l);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);box-shadow:var(--glass-shadow);color:var(--pink);display:grid;place-items:center;flex:0 0 auto;padding:0}
.hid-add-btn svg{width:20px;height:20px;transition:transform .38s var(--ios-ease)}
.hid-add-btn.open svg{transform:rotate(45deg)}
.hid-add-pop{position:fixed;z-index:270;min-width:240px;padding:8px;border-radius:18px;background:var(--sheet-fill);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--glass-edge);box-shadow:0 2px 8px rgba(0,0,0,.08);transform-origin:top right;opacity:0;transform:translate(26px,-16px) scale(.6);transition:opacity .3s var(--ios-ease),transform .38s var(--ios-ease)}
.hid-add-pop.open{opacity:1;transform:none}
.hid-add-pop.closing{opacity:0;transform:translate(26px,-16px) scale(.6)}
.hid-add-pop button{display:block;width:100%;text-align:left;padding:12px 16px;border:0;background:transparent;border-radius:12px;font-size:16px;font-weight:550;color:var(--text)}
.hid-add-pop button:active{background:rgba(127,127,127,.14)}

/* ===== stage8: yedek kategorileri ===== */
.bk-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.bk-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-radius:16px;background:var(--glass-l);border:1px solid var(--glass-edge);font-size:15px}
.bk-row span{flex:1;min-width:0}
.bk-all{background:color-mix(in srgb,var(--pink) 10%,var(--glass-l))}
.bk-off{opacity:.45}
.bk-row .toggle:disabled{opacity:.5}
.bk-cloud{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.bk-cloud button{padding:12px 12px;border-radius:999px;font-size:15px;font-weight:600}
.note-menu{opacity:1!important;transform:none!important;pointer-events:auto!important;width:33px;height:33px}
.planner-row .msg-check{flex:0 0 auto}
.note-list{display:flex;flex-direction:column;gap:12px}
.note-card{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;border:0;padding:16px}
.note-card.on{box-shadow:0 0 0 2px var(--pink)}
.note-txt{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.note-txt strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-date{font-size:11px}
.note-card .msg-check{margin-top:2px}

/* ===== nav: sayfa yığını geçişleri ===== */
.modalback.ghost{pointer-events:none}
.modalback.ghost-push{z-index:99}
.modalback.ghost-pop{z-index:101}
.modalback.ghost-push .sheet.sheet{animation:iosGhostBack .35s var(--ios-ease) forwards!important}
.modalback.ghost-pop .sheet.sheet{animation:iosPushOut .35s var(--ios-ease) forwards!important}

/* ===== stage37: düz arka planda hafif gölge ===== */

.navitem.active{background:color-mix(in srgb,var(--accent) 16%,transparent)!important;color:var(--accent)!important}

.specdot{position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:#ff9500;box-shadow:0 0 0 2px rgba(255,149,0,.22)}
.daycell{position:relative}
#sdForm .ct-f input,#sdForm .ct-f select{height:46px;border-radius:999px;padding:0 16px;font-size:16px;border:1px solid var(--glass-edge);background:var(--glass-l);color:var(--text);width:100%;box-sizing:border-box}

/* ===== stage43: klasör simgeleri, ayar simgesi görünümü ===== */

/* ===== stage44: medya bilgi kartı ===== */
.details-panel{background:rgba(22,22,28,.74)!important;-webkit-backdrop-filter:blur(28px) saturate(160%);backdrop-filter:blur(28px) saturate(160%);color:#fff!important;border:1px solid rgba(255,255,255,.14);border-bottom:0;box-shadow:0 2px 8px rgba(0,0,0,.08)}

.md-edit[hidden]{display:none}
.md-box{display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:12px 16px;color:#fff}

.md-box input{background:transparent;border:0;color:#fff;font-size:16px;text-align:right;outline:none;color-scheme:dark}

/* ===== stage45: hikâye stüdyosu ===== */
.story-preview{position:relative;aspect-ratio:9/16;max-height:62vh;margin:0 auto;border-radius:22px;overflow:hidden;background:#0b0b0d}
.story-photos{position:absolute;inset:0}
.sp-item{position:absolute;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08);transition:left .25s var(--ios-ease),top .25s var(--ios-ease),width .25s var(--ios-ease),height .25s var(--ios-ease)}
.sp-item img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.sp-handle{position:absolute;right:6px;bottom:6px;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 2px 6px rgba(0,0,0,.35);cursor:nwse-resize;touch-action:none;z-index:3}
.sp-handle::after{content:"";position:absolute;inset:6px;border-right:2px solid rgba(0,0,0,.5);border-bottom:2px solid rgba(0,0,0,.5)}
.story-logo{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;letter-spacing:.14em;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.5);z-index:4;pointer-events:none}
.story-actions{gap:8px}
.story-actions .secondary,.story-actions .primary{flex:1;min-width:0;padding:12px 8px;font-size:15px;border-radius:999px}

/* ===== stage46 ===== */
body.bg-default .luma-chart-card{--pink:var(--accent)!important;--pink-soft:color-mix(in srgb,var(--accent) 18%,transparent)!important}

/* ===== stage47: liquid glass bükülme ve kenar parlaması ===== */

@supports not ((backdrop-filter:url(#luma-lg)) or (-webkit-backdrop-filter:url(#luma-lg))){body.lg-on .bottomnav,body.lg-on .topbar{backdrop-filter:blur(16px) saturate(190%)}}

[data-theme="dark"] body.lg-on .card,[data-theme="dark"] body.lg-on .sel-menu-btn,[data-theme="dark"] body.lg-on .iconbtn,[data-theme="dark"] body.lg-on .primary,[data-theme="dark"] body.lg-on .secondary,[data-theme="dark"] body.lg-on .sel-bar-btn,[data-theme="dark"] body.lg-on .doc-fab,[data-theme="dark"] body.lg-on .dfold,[data-theme="dark"] body.lg-on .note-card,[data-theme="dark"] body.lg-on .ct-row,[data-theme="dark"] body.lg-on .hid-tile,[data-theme="dark"] body.lg-on .doc-card,[data-theme="dark"] body.lg-on .album-card,[data-theme="dark"] body.lg-on .planner-row{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 34%,transparent), inset 0 14px 24px -16px color-mix(in srgb,var(--accent) 55%,transparent), 0 2px 8px rgba(0,0,0,.08)}
[data-theme="dark"] body.lg-on .card:active,[data-theme="dark"] body.lg-on button:active{box-shadow:inset 0 0 0 1.4px color-mix(in srgb,var(--accent) 70%,transparent), inset 0 0 22px color-mix(in srgb,var(--accent) 35%,transparent), 0 2px 8px rgba(0,0,0,.08)}

/* ===== stage50: üç çizgi düğmeleri tek tip ===== */
.sel-menu-btn,.sheet-menu-btn{display:flex!important;flex-direction:column;align-items:center;justify-content:center;gap:4px!important}
.sel-menu-btn span,.sheet-menu-btn span{display:block!important;width:16px!important;height:2px!important;margin:0!important;border-radius:2px;background:var(--text)}

/* ===== v81: sekme geçiş animasyonları sadeleştirildi — yalnızca yumuşak yatay kayma ===== */
/* (eski sallanma / ölçek / esneme animasyonları kaldırıldı) */

/* ===== stage53: geri geçiş ve kapanış yönü ===== */
.modalback.is-closing.dir-same .sheet.sheet,.modalback.is-closing.dir-pop .sheet.sheet,.modalback.is-closing.dir-first .sheet.sheet,.modalback.is-closing .sheet.sheet{animation:iosPushOut var(--ios-dur) var(--ios-ease) forwards!important}
.modalback.dir-pop .sheet.sheet{animation:iosPopIn .38s var(--ios-ease) backwards!important}

/* ===== stage54: bildirim temizle düğmesi ortada ===== */
.notice-clear{left:auto!important;right:18px!important;bottom:calc(96px + env(safe-area-inset-bottom))!important;width:56px!important;height:56px!important;min-width:56px!important;min-height:56px!important;padding:0!important;border-radius:50%!important;transform:none!important;display:grid!important;place-items:center;color:var(--red)!important;font-size:0!important;transition:transform .22s var(--ios-ease),background .22s var(--ios-ease),box-shadow .22s var(--ios-ease)!important}

.notice-clear:active{transform:scale(.9)!important;background:var(--surface2)!important;box-shadow:0 1px 4px rgba(0,0,0,.12)!important}

/* ===== stage55: arka plan sayfası ===== */
:root[data-theme] .sheet .reset-box.bg-sheet{background:color-mix(in srgb,#1c1c1e 94%,var(--sheet-card) 6%)!important;color:#f5f5f7!important;border:.5px solid color-mix(in srgb,var(--line) 75%,#fff 25%)!important;border-radius:16px;padding:12px!important;gap:12px;box-shadow:var(--soft-shadow)!important}
:root[data-theme="light"] .sheet .reset-box.bg-sheet{background:var(--sheet-card)!important;color:var(--text)!important;border-color:var(--line)!important}
.bg-sheet .bg-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-inline:2px}
.bg-sheet .bg-tile{aspect-ratio:9/16;border-radius:13px}
.bg-sheet .bg-tile span{font-size:10px;padding:2px 4px;margin-bottom:5px;max-width:88%}

/* ===== stage61: sesli mesajı iptal çarpısı ===== */
#msgSend{position:relative}
.rec-x{position:absolute;inset:0;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;z-index:3;animation:recXIn .32s var(--ios-ease) backwards;cursor:pointer}
.rec-x svg{width:55%;height:55%;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round}
@keyframes recXIn{from{opacity:0;transform:scale(.55) rotate(-90deg)}to{opacity:1;transform:scale(1) rotate(0)}}

/* ===== stage62: uygulama içi dosya görüntüleme ===== */
.fv-wrap{display:flex;justify-content:center;align-items:center;width:100%}
.fv-img,.fv-vid{max-width:100%;max-height:70vh;border-radius:18px;display:block}

/* ===== stage63: bilgi kartı düzenleme modu ===== */
.md-head{display:flex;align-items:center;justify-content:space-between;gap:8px}

/* ===== stage65: görüntüleyici arayüz geçişi ve görsel boyutu ===== */

/* ===== stage67: sayfa yığını — alttaki sayfa sabit, üstteki kayar ===== */
.modalback.ghost-push .sheet.sheet{animation:none!important;box-shadow:none!important}

.modalback.dir-pop .sheet.sheet{animation:none!important;box-shadow:none!important}
.modalback.ghost .sheet.sheet{box-shadow:none!important}

/* ===== stage70: medya arama kapatma ===== */
/* ===== stage71: koyu modda profil avatarı (fotoğrafsız) daha koyu gri ===== */
[data-theme="dark"] #profileOpen.profile-has-avatar,
[data-theme="dark"] .profile-avatar:not(:has(img)),
[data-theme="dark"] .apple-hero .profile-avatar:not(:has(img)){background:#2a2a2d!important;background-image:none!important}

/* ===== stage72: belgelerde arama — klasörler kapanır, belgeler yukarı kayar ===== */
.dfolders{transition:max-height .45s var(--ios-ease),opacity .35s var(--ios-ease),margin .45s var(--ios-ease);max-height:1200px;overflow:hidden}

/* ===== v81: kompakt, simetrik, sarsıntısız sekme çubuğu + 3B kayan baloncuk ===== */
/* Çubuk dört yandan (üst/alt + sağ/sol) eşit daraltılır; simge boyutu sabit kalır. */
.bottomnav{height:60px!important;width:min(270px,calc(100% - 32px))!important;padding:8px!important;transition:width .4s var(--ios-ease),height .4s var(--ios-ease),padding .4s var(--ios-ease),border-radius .4s var(--ios-ease),transform .35s var(--ios-ease),opacity .35s var(--ios-ease)!important}

.bottomnav .navitem{padding:8px 0!important;gap:4px!important;min-height:44px!important;-webkit-tap-highlight-color:transparent}

.bottomnav .navitem svg{width:24px!important;height:24px!important;transition:transform .3s cubic-bezier(.2,.9,.3,1)}

.bottomnav .navitem.active{background:transparent!important;box-shadow:none!important;color:var(--accent)!important}
.bottomnav .navitem.active svg{fill:none!important;transform:scale(1.12)!important}
/* Kayan baloncuk: tek vurgu; yatay akışkan kayma, kenarlardan 3B gölgelendirme. */
.bottomnav .nav-slider{
 pointer-events:none;position:absolute;z-index:-1;
 left:6px!important;top:6px!important;bottom:6px!important;
 width:calc((100% - 12px)/5)!important;
 transform:translateX(calc(var(--nav-index,0)*100%));
 transition:transform .4s var(--ios-ease)!important;
 animation:none!important;scale:1 1!important;
 border:none!important;border-radius:999px!important;
 background:linear-gradient(180deg,rgba(255,255,255,.62) 0%,rgba(255,255,255,.16) 45%,rgba(0,0,0,.04) 100%),color-mix(in srgb,var(--accent) 22%,transparent)!important;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(0,0,0,.12), inset 1px 0 0 rgba(255,255,255,.45), inset -1px 0 0 rgba(0,0,0,.08), 0 2px 4px rgba(0,0,0,.14), 0 2px 8px rgba(0,0,0,.08)!important;
 backdrop-filter:blur(14px) saturate(200%)!important;-webkit-backdrop-filter:blur(14px) saturate(200%)!important;
}
[data-theme="dark"] .bottomnav .nav-slider{
 background:linear-gradient(180deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,.06) 45%,rgba(0,0,0,.16) 100%),color-mix(in srgb,var(--accent) 30%,transparent)!important;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.35), inset 0 -1px 0 rgba(0,0,0,.35), inset 1px 0 0 rgba(255,255,255,.12), inset -1px 0 0 rgba(0,0,0,.2), 0 2px 4px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.08)!important;
}
/* Eski animasyon sınıflarını tamamen kapat (sarsıntı ve çubuk dışına taşma kaynağı). */
.bottomnav.nav-wobble,.bottomnav.nav-go-left,.bottomnav.nav-go-right,
.bottomnav.nav-edge-left,.bottomnav.nav-edge-right{animation:none!important;scale:1 1!important;transform-origin:50% 50%!important}
.bottomnav .nav-slider.liquid,.bottomnav .nav-slider.nav-flow,
.bottomnav .nav-slider.st-r,.bottomnav .nav-slider.st-l{animation:none!important;scale:1 1!important}
body.nav-full .bottomnav{
 width:min(270px,calc(100% - 32px))!important;height:60px!important;padding:8px!important;
 transition:transform .35s var(--ios-ease),opacity .35s var(--ios-ease)!important
}
.msg-compose{bottom:calc(var(--nav-size,60px) + var(--nav-stack-offset,24px) + env(safe-area-inset-bottom));transition:opacity var(--ios-dur) var(--ios-ease),transform var(--ios-dur) var(--ios-ease)!important}
.bottomnav .navitem{transition:color .2s var(--ios-ease),transform .14s var(--ios-ease)!important}
.bottomnav .navitem:active{transform:scale(.96)!important}
.bottomnav .navitem:focus:not(:focus-visible){outline:none!important;box-shadow:none!important}
.searchbox input[type=search],.searchbox input[type=search]:focus{
 -webkit-appearance:none!important;appearance:none!important;background:transparent!important;border:0!important;
 border-radius:0!important;box-shadow:none!important;outline:none!important
}
.modalback .sheet.solid-sheet .searchbox input[type=search]:not([type=checkbox]):not([type=range]),
.modalback .sheet.solid-sheet .searchbox input[type=search]:focus:not([type=checkbox]):not([type=range]){
 background:transparent!important;border:0!important;border-radius:0!important;box-shadow:none!important
}
.searchbox input[type=search]::-webkit-search-decoration,
.searchbox input[type=search]::-webkit-search-cancel-button,
.searchbox input[type=search]::-webkit-search-results-button,
.searchbox input[type=search]::-webkit-search-results-decoration{-webkit-appearance:none}
html,body{width:100%;overflow-x:hidden}
.app{width:min(100%,860px);padding-inline:clamp(12px,4.5vw,22px)}
