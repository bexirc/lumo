.hid-tile{position:relative}
.hid-restore-row{margin-left:auto;flex:0 0 auto}
.hid-row{display:flex;align-items:center;gap:10px;flex-wrap:nowrap}
.planner-row{border-radius:16px!important}

/* ===== stage26 ===== */
.setting-row:has(#wakeTime){flex-wrap:wrap;row-gap:10px}
.setting-row:has(#wakeTime) .row{margin-left:42px;width:calc(100% - 42px);display:flex;gap:10px}
.setting-row:has(#wakeTime) #wakeTime,.setting-row:has(#wakeTime) #sleepTime{flex:1;width:auto!important;min-width:0;border-radius:999px;padding:11px 14px!important;box-sizing:border-box}
.sheet-menu-btn{width:39px;height:39px;border-radius:50%;border:1px solid var(--glass-edge);background:var(--glass-l);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);box-shadow:var(--glass-shadow);display:grid;place-items:center;flex:0 0 auto;padding:0;gap:4px;flex-direction:column}
.sheet-menu-btn span{display:block;width:16px;height:2px;border-radius:2px;background:var(--text)}
.sheet-head .head-right{display:flex;gap:8px;align-items:center}
.storage-row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;gap:12px}
.storage-bar{height:8px;border-radius:99px;background:var(--surface3);overflow:hidden;margin-top:8px}
.storage-bar i{display:block;height:100%;border-radius:99px;background:var(--pink);transition:width .6s var(--ios-ease)}

/* ===== stage27 ===== */
.fcell:has(#nfColors){border-radius:26px;overflow:hidden;background:var(--glass-l);border:1px solid var(--glass-edge);padding:0}
.fcell:has(#nfColors) label{padding:14px 18px 0}
#nfColors{margin:10px 14px 14px;padding:22px 24px!important;background:transparent;border:0;box-sizing:border-box;width:auto}
.sheet-menu-btn.sel-menu-btn{opacity:1!important;transform:none!important;pointer-events:auto!important;width:39px;height:39px}
.memories-selector.mem-seg-wide{position:relative!important;bottom:auto!important;margin:0 0 14px!important;width:100%!important;max-width:none!important;display:flex!important;justify-content:center!important;box-sizing:border-box}
.memories-selector.mem-seg-wide button{flex:1 1 0;text-align:center}
.memories-selector.mem-seg-wide .mem-bubble{top:4px;bottom:4px}
#memorySearch{border-radius:999px}
.row[hidden],.memories-selector[hidden]{display:none!important}

/* ===== stage28: albüm seçimi ===== */
[data-album-toggle]{position:relative}
.alb-check{position:absolute;right:10px;top:10px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.25);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;z-index:2}
.alb-on .alb-check{background:var(--pink);border-color:var(--pink)}
.alb-on{box-shadow:0 0 0 3px var(--pink)}

/* ===== stage29: seçim çubuğu ===== */
.title-out{opacity:0!important;transform:translate3d(0,-14px,0)!important;pointer-events:none;transition:opacity .3s var(--ios-ease),transform .3s var(--ios-ease)}
.sel-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:44px;position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);padding:0 2px;box-sizing:border-box}
.sheet-head .sel-bar{position:absolute;left:0;right:0;top:50%}
.sel-bar-in{animation:selBarIn .38s var(--ios-ease) backwards}
@keyframes selBarIn{from{opacity:0;transform:translate3d(0,-14px,0)}to{opacity:1;transform:translate3d(0,-50%,0)}}
.sel-bar-btn{border:1px solid var(--glass-edge);background:var(--glass-l);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);box-shadow:var(--glass-shadow);color:var(--pink);font-weight:700;font-size:15px;border-radius:999px;padding:9px 16px;white-space:nowrap;transition:transform .25s var(--ios-ease)}
.sel-bar-btn:active{transform:scale(.95)}
.sel-bar-btn.danger{color:#ff3b30}
.sel-bar-btn:disabled{opacity:.4}
.sel-bar-n{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}
.sheet-head{position:relative}
#titleRow{position:relative}

/* ===== stage30: seçim modunda yalnız seçim işlevleri aktif ===== */
body.sel-mode-on button:not(.sel-keep):not(.sel-bar-btn){pointer-events:none!important;opacity:.38!important;transition:opacity .25s var(--ios-ease)}
body.sel-mode-on .sel-keep{pointer-events:auto}
body.sel-mode-on .bottomnav{pointer-events:none;opacity:.5}
body.sel-mode-on #memSearchBtn,body.sel-mode-on #memUpBtn,body.sel-mode-on #docUpBtn,body.sel-mode-on #docFolderBtn,body.sel-mode-on #msgMic,body.sel-mode-on #msgAttach,body.sel-mode-on [data-action="add-media"],body.sel-mode-on #newFolderBtn,body.sel-mode-on #moodAddBtn,body.sel-mode-on .doc-fab,body.sel-mode-on #docFab,body.sel-mode-on .ct-add-fab,body.sel-mode-on #hidAddBtn,body.sel-mode-on #msgCompose,body.sel-mode-on #memorySearch,body.sel-mode-on #docSearch,body.sel-mode-on #msgSearch,body.sel-mode-on #ctSearch,body.sel-mode-on #allNotesSearch{display:none!important}
body.sel-mode-on .sel-bar-btn{pointer-events:auto}

/* ===== stage31: seçim çubuğu üst üste binmesin ===== */
.sel-bar{right:52px!important;left:0!important;justify-content:flex-start!important;gap:8px!important;width:auto!important;padding-right:0!important}
.sheet-head .sel-bar{right:52px!important;left:0!important}
#selRight,.head-right{position:relative;z-index:3}
body.sel-mode-on .dfold{pointer-events:auto!important;opacity:1!important}

/* ===== stage32: menü seçenekleri her zaman aktif ===== */
body.sel-mode-on #selPop button,body.sel-mode-on .sel-pop button,body.sel-mode-on .sel-pop button:disabled{pointer-events:auto!important;opacity:1!important}
body.sel-mode-on .sel-pop button:disabled{opacity:.38!important;pointer-events:none!important}

/* ===== stage33: mesajlar ===== */
#msgMic[hidden],#msgDateBtn{display:none}
body.msg-tab .topbar.compact #msgDateBtn{display:grid}
.msg-search-row{margin:0 0 12px}
.msg-search-row[hidden]{display:none!important}
.msg-row{justify-content:space-between!important;align-items:center}
.msg-time-side{font-size:11px;color:var(--muted);white-space:nowrap;align-self:center;padding:0 6px;order:-1}
.msg-row .msg-time-side{margin-right:auto}
.msg-row.on .msg-time-side{margin-left:0}
.msg-bubble.audio{min-width:230px;padding:8px 10px}
.vp{display:flex;align-items:center;gap:8px;color:#fff;width:100%}
.vp-play{width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:0 0 auto}
.vp-play svg{width:16px;height:16px;fill:#fff;stroke:none}
.vp-bar{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.35);overflow:hidden;min-width:60px}
.vp-bar i{display:block;height:100%;width:0;background:#fff;transition:width .2s linear}
.vp-speed{border:0;background:rgba(255,255,255,.22);color:#fff;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700;flex:0 0 auto}
.vp audio{display:none}
.msg-inwrap{position:relative;flex:1;min-width:0;display:flex;flex-direction:column}
.rec-hint{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--pink);font-weight:600;font-size:15px;opacity:0;pointer-events:none;transition:opacity .3s var(--ios-ease);z-index:2}
.msg-compose.rec-on .rec-hint{opacity:1}
.msg-compose.rec-on #msgText{opacity:0;transition:opacity .25s var(--ios-ease)}
#msgText{transition:opacity .25s var(--ios-ease)}
.msg-compose.rec-on #msgSend{background:var(--pink);color:#fff;animation:recBlink 1s ease-in-out infinite}
@keyframes recBlink{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--pink) 60%,transparent);transform:scale(1)}50%{box-shadow:0 0 0 12px transparent;transform:scale(1.06)}}
.topbar.compact .title-row{align-items:center}

/* ===== stage35: ajanda ===== */
.calendar-grid{grid-template-columns:repeat(7,minmax(0,1fr))!important;gap:6px!important}
.daycell{width:100%!important;height:54px!important;aspect-ratio:auto!important;min-width:0;padding:0!important;display:flex!important;align-items:center;justify-content:center;position:relative;overflow:hidden}
.daycell span{font-size:28px!important;line-height:1;font-weight:600}
.cal-title-btn{border:0;background:transparent;color:var(--text);font-weight:700;font-size:17px;padding:8px 14px;border-radius:999px;cursor:pointer;transition:background .25s var(--ios-ease)}
.cal-title-btn:active{background:color-mix(in srgb,var(--pink) 14%,transparent)}
.agenda-menu-btn{opacity:1!important;transform:none!important;pointer-events:auto!important;width:39px;height:39px}
.dp-card{display:flex;flex-direction:column;gap:14px}
.dp-cols{display:grid;grid-template-columns:1fr 1.3fr .8fr;gap:10px;height:300px}
.dp-col{overflow-y:auto;border-radius:22px;background:var(--glass-l);border:1px solid var(--glass-edge);padding:8px;display:flex;flex-direction:column;gap:4px;scroll-behavior:smooth}
.dp-h{font-size:12px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0 6px}
.dp-item{border:0;background:transparent;color:var(--text);padding:10px 8px;border-radius:14px;font-size:16px;font-weight:600;text-align:center}
.dp-item.on{background:var(--pink);color:#fff}

/* ===== stage37: düz arka planda hafif gölge ===== */
body.bg-solid .luma-home button:not(.story-ring),
body.bg-solid .luma-home .card,
body.bg-solid .memories-selector,
body.bg-solid .memories-selector button,
body.bg-solid #mainContent .dfold,
body.bg-solid #mainContent .card button,
body.bg-solid .dfold,
body.bg-solid .doc-card,
body.bg-solid .album-card{box-shadow:0 2px 10px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05)}
[data-theme="dark"] body.bg-solid .luma-home button:not(.story-ring),
[data-theme="dark"] body.bg-solid .luma-home .card,
[data-theme="dark"] body.bg-solid .memories-selector,
[data-theme="dark"] body.bg-solid .dfold,
[data-theme="dark"] body.bg-solid .doc-card,
[data-theme="dark"] body.bg-solid .album-card{box-shadow:0 2px 10px rgba(255,255,255,.06),0 1px 2px rgba(255,255,255,.04)}

/* ===== stage38: vurgu rengi (gezinme balonu ve belge ekle) ===== */
.navitem.active{background:color-mix(in srgb,var(--accent) 16%,transparent)!important;color:var(--accent)!important}

.bottomnav{height:60px!important;width:min(270px,calc(100% - 32px))!important;padding:6px!important;transition:width .4s var(--ios-ease),height .4s var(--ios-ease),padding .4s var(--ios-ease),border-radius .4s var(--ios-ease),transform .35s var(--ios-ease),opacity .35s var(--ios-ease)!important}

 pointer-events:none;position:absolute;z-index:-1;

 background:linear-gradient(180deg,rgba(255,255,255,.62) 0%,rgba(255,255,255,.16) 45%,rgba(0,0,0,.04) 100%),color-mix(in srgb,var(--accent) 22%,transparent)!important;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(0,0,0,.12),inset 1px 0 0 rgba(255,255,255,.45),inset -1px 0 0 rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.14),0 10px 22px rgba(0,0,0,.18)!important;
 backdrop-filter:blur(14px) saturate(200%)!important;-webkit-backdrop-filter:blur(14px) saturate(200%)!important;
}

 box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(0,0,0,.35),inset 1px 0 0 rgba(255,255,255,.12),inset -1px 0 0 rgba(0,0,0,.2),0 2px 4px rgba(0,0,0,.3),0 12px 26px rgba(0,0,0,.45)!important;
}

}

}

function missingHours(date){const wake=Number((state.settings.wakeTime||'08:00').slice(0,2)),sleep=Number((state.settings.sleepTime||'23:00').slice(0,2));const now=new Date();if(date===dateKey(now)&&now.getHours()<sleep){}const end=date===dateKey(now)?Math.min(sleep,now.getHours()):sleep;const out=[];for(let h=wake;h<end;h++){if(!state.moodRecords.some(r=>r.date===date&&Number(r.time.slice(0,2))===h))out.push(`${String(h).padStart(2,'0')}:00`)}return out}
function stability(records){if(records.length<2)return '—';const avg=records.reduce((s,r)=>s+r.score,0)/records.length;const sd=Math.sqrt(records.reduce((s,r)=>s+Math.pow(r.score-avg,2),0)/records.length);return `${Math.max(0,100-Math.round(sd))}%`}

function isFemale(){return (state.profile?.gender||'')==='Kadın'}
function dayDiff(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000)}
function addDays(k,n){const d=new Date(k+'T00:00:00');d.setDate(d.getDate()+n);return dateKey(d)}
function cycleStats(){const c=state.cycle;const st=[...c.starts].sort();let cyc=c.avgCycle,len=c.avgLen;if(st.length>=2){const gaps=[];for(let i=1;i<st.length;i++)gaps.push(dayDiff(st[i-1],st[i]));cyc=Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length)}const ends=c.ends||[];if(c.starts.length&&ends.length){const L=[];for(const s0 of st){const e=ends.filter(e=>e>=s0).sort()[0];if(e)L.push(dayDiff(s0,e)+1)}if(L.length)len=Math.round(L.reduce((a,b)=>a+b,0)/L.length)}return {cyc,len,last:st[st.length-1]||''}}
function inPeriodDay(k){const st=state.cycle.starts||[];const en=state.cycle.ends||[];const {len}=cycleStats();return st.some(s0=>{if(k<s0)return false;const e=en.filter(x=>x>=s0).sort()[0]||addDays(s0,len-1);return k<=e})}

function stressAvg(arr){return arr.length?Math.round(arr.reduce((a,b)=>a+b.value,0)/arr.length):null}
function reportedKeys(){try{return JSON.parse(localStorage.getItem('luma-stress-reported')||'[]')}catch(e){return []}}
function markReported(k){const a=reportedKeys();if(!a.includes(k))a.push(k);localStorage.setItem('luma-stress-reported',JSON.stringify(a.slice(-80)))}
function buildStressReport(rows,title,key){
 const period=rows.filter(r=>r.inPeriod),normal=rows.filter(r=>!r.inPeriod);
 const lines=[];lines.push(`Genel ortalama: ${stressAvg(rows)} / 100 (${rows.length} ölçüm)`);
 if(isFemale()){lines.push(`Regl dönemi ortalaması: ${stressAvg(period)??'—'} / 100 (${period.length} ölçüm)`);lines.push(`Normal günlerin ortalaması: ${stressAvg(normal)??'—'} / 100 (${normal.length} ölçüm)`)}
 lines.push('');lines.push('Bu rapor tıbbi bir teşhis değildir. Puanlar uzun süre yüksek kalırsa bir uzmana danışmanı öneririz.');
 state.documents.push({id:uuid(),title,date:dateKey(new Date()),history:[{at:Date.now(),note:'Otomatik rapor'}],body:lines.join('\n'),autoReport:true,reportKey:key});
 saveLocal();markReported(key);
 addNotice(`${title} hazır. Dosyalarım'de.`,'',null);
}
function weekKey(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));const wk=Math.ceil((((t-y0)/86400000)+1)/7);return `${t.getUTCFullYear()}-W${String(wk).padStart(2,'0')}`}
function stressReports(){
 const st=state.settings||{};const wk=st.reportWeekly??true;const mo=st.reportMonthly??false;
 const now=new Date();const done=reportedKeys();
 if(wk){
  const k=weekKey(new Date(now.getFullYear(),now.getMonth(),now.getDate()-1));
  const end=new Date(now.getFullYear(),now.getMonth(),now.getDate()-1);const start=new Date(end);start.setDate(end.getDate()-6);
  const rows=(state.stress||[]).filter(r=>r.date>=dateKey(start)&&r.date<=dateKey(end));
  const key='W:'+k;
  if(rows.length&&!done.includes(key))buildStressReport(rows,'Haftalık stres raporu ('+dateKey(start)+' – '+dateKey(end)+')',key);
 }
 if(mo){
  const N=Math.max(1,Math.min(4,state.settings.reportMonthInterval||1));
  const idx=now.getFullYear()*12+now.getMonth();const block=Math.floor(idx/N)-1;
  if(block>=0){
   const startIdx=block*N,endIdx=startIdx+N-1;
   const inRange=d=>{const [y,m]=d.split('-').map(Number);const v=y*12+(m-1);return v>=startIdx&&v<=endIdx};
   const rows=(state.stress||[]).filter(r=>inRange(r.date));
   const sy=Math.floor(startIdx/12),sm=startIdx%12,ey=Math.floor(endIdx/12),em=endIdx%12;
   const a=new Date(sy,sm,1).toLocaleDateString('tr-TR',{month:'long',year:'numeric'});const b2=new Date(ey,em,1).toLocaleDateString('tr-TR',{month:'long',year:'numeric'});
   const title=N===1?`${a} stres raporu`:`${a} – ${b2} stres raporu`;
   const key=`M${N}:${block}`;
   if(rows.length&&!done.includes(key))buildStressReport(rows,title,key);
  }
 }
}

function __removeNoticeCards(cards,s,{exit='up'}={}){
 const sheet=s?.closest('.sheet')||s;
 const removing=cards.filter(c=>c?.isConnected&&!c.dataset.noticeRemoving);
 if(!sheet||!removing.length||sheet.dataset.noticeAnimating==='true')return false;
 const ids=new Set(removing.map(c=>c.dataset.noticeId).filter(Boolean));
 if(!ids.size)return false;
 sheet.dataset.noticeAnimating='true';
 const flow=[...sheet.children].filter(el=>!removing.includes(el)&&el.getClientRects().length);
 const before=new Map(flow.map(el=>[el,el.getBoundingClientRect().top]));
 removing.forEach(c=>{c.dataset.noticeRemoving='true';c.style.pointerEvents='none'});
 state.notices=(state.notices||[]).filter(n=>!ids.has(n.id));refreshBell();__reindex(s);
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches||document.documentElement.dataset.motion==='off';
 const duration=reduced?1:280;
 const animations=removing.map((card,i)=>{
  const shift=exit==='right'?(card.getBoundingClientRect().width+30):exit==='left'?-(card.getBoundingClientRect().width+30):0;
  const currentTransform=getComputedStyle(card).transform;
  const currentOpacity=getComputedStyle(card).opacity;
  const frames=exit==='up'
   ?[{opacity:currentOpacity,transform:currentTransform,maxHeight:`${card.getBoundingClientRect().height}px`,marginBottom:'10px'},{opacity:0,transform:'translate3d(0,-14px,0)',maxHeight:'0px',marginBottom:'0px'}]
   :[{opacity:currentOpacity,transform:currentTransform},{opacity:0,transform:`translate3d(${shift}px,0,0)`}];
  return card.animate(frames,{duration,easing:'cubic-bezier(.32,.72,0,1)',delay:reduced?0:i*35,fill:'forwards'});
 });
 Promise.all(animations.map(a=>a.finished.catch(()=>{}))).then(()=>{
  removing.forEach(c=>c.remove());
  requestAnimationFrame(()=>{
   const moves=[];
   flow.forEach(el=>{
    if(!el.isConnected)return;
    const delta=before.get(el)-el.getBoundingClientRect().top;
    if(Math.abs(delta)>1)moves.push(el.animate([{transform:`translate3d(0,${delta}px,0)`},{transform:'translate3d(0,0,0)'}],{duration:reduced?1:360,easing:'cubic-bezier(.22,.7,.2,1)'}));
   });
   Promise.all(moves.map(a=>a.finished.catch(()=>{}))).then(()=>{
    delete sheet.dataset.noticeAnimating;__syncClear();
   });
  });
 });
 return true;
}

function __swipeNotice(card,s){

 card.addEventListener('pointerdown',e=>{if(s.closest('.sheet')?.dataset.noticeAnimating==='true')return;x0=e.clientX;dx=0;card.setPointerCapture(e.pointerId);card.style.transition='none'});
 card.addEventListener('pointermove',e=>{if(x0===null)return;dx=e.clientX-x0;card.style.transform=`translate3d(${dx}px,0,0)`;card.style.opacity=String(Math.max(.25,1-Math.abs(dx)/260))});
 const end=()=>{if(x0===null)return;const w=card.offsetWidth;const gone=Math.abs(dx)>w*0.38;x0=null;card.style.transition=`transform .32s cubic-bezier(.32,.72,0,1), opacity .32s`;

}

async function addMediaFiles(files){
 const list=[...files].filter(f=>isImageFile(f)||(f.type||'').startsWith('video/'));
 if(!list.length)return;

  const blob=await toDisplayBlob(file);
  const item={id:uuid(),name:file.name||'Anı',type:file.type.startsWith('video/')?'video':'image',date:dateKey(new Date(file.lastModified||Date.now())),time:timeNow(),size:file.size,createdAt:Date.now(),favorite:false,blob,url:URL.createObjectURL(blob),duration:'0:00'};

  try{await dbPut('media',{id:item.id,blob,meta:{...item,blob:undefined,url:undefined}})}catch(e){console.warn('Media persistence',e)}
  state.upload.done++;refreshBell();paintUpload();

}

function storyLayout(items){
 const st=storySettings();const W=1080,H=1920;const n=items.length;
 const pad=(!st.frameOn||st.fullBleed)?0:Math.round(st.frame*2.5);
 const gap=(!st.frameOn||st.fullBleed)?0:Math.round(st.frame);
 const top=st.fullBleed?0:150;const bottom=(st.title||st.caption)?360:160;
 const x0=pad,y0=top,w=W-pad*2,h=H-top-bottom;
 const wts=items.map(m=>Math.max(.3,Math.min(3,st.sizes[m.id]||1)));
 const sum=wts.reduce((a,b)=>a+b,0);
 const out=[];
 if(st.layout==='side'){let x=x0;items.forEach((m,i)=>{const cw=(w-gap*(n-1))*wts[i]/sum;out.push({id:m.id,x,y:y0,w:cw,h});x+=cw+gap})}

  const cols=n<=2?n:2,rows=Math.ceil(n/cols);

 }

}

function checkHourlyReminder(){if(state.settings.weeklyBackup&&(!state.settings.lastBackup||Date.now()-state.settings.lastBackup>7*86400000))addNotice('LUMA yedeğini almayı unutma.','Yedek al',()=>openBackup());if(!state.settings.reminders)return;const now=new Date(),date=dateKey(now),hour=now.getHours(),wake=Number((state.settings.wakeTime||'08:00').slice(0,2)),sleep=Number((state.settings.sleepTime||'23:00').slice(0,2));if(hour<wake||hour>=sleep)return;if(state.moodRecords.some(r=>r.date===date&&Number(r.time.slice(0,2))===hour))return;const key=`${date}-${String(hour).padStart(2,'0')}`;if(sessionStorage.getItem('luma-reminded-hour')===key)return;sessionStorage.setItem('luma-reminded-hour',key);addNotice('Ruh halini kaydetmek ister misin?','Kaydet',()=>{openMoodEditor(null,date);setTimeout(()=>{const t=$('#moodTime');if(t)t.value=`${String(hour).padStart(2,'0')}:00`},30)},7000)}

function showPinLock(){
 if($('#lockscreen'))return;
 const len=state.settings.pinLength||4;
 const root=document.createElement('div');root.className='lockscreen';root.id='lockscreen';
 const padKeys=[1,2,3,4,5,6,7,8,9,'',0,'del'].map(k=>k===''?'<span></span>':`<button type="button" class="pad-key" data-key="${k}" aria-label="${k==='del'?'Sil':k}">${k==='del'?'⌫':k}</button>`).join('');
 root.innerHTML=`<div class="lockbox" id="lockBox"><span class="lock-logo" role="img" aria-label="LUMA"></span><h1 class="lock-title">Kilitli</h1><p class="muted small lock-sub" id="lockSub">PIN'ini gir</p><div class="pin-dots" id="pinDots">${Array.from({length:len},()=>'<i></i>').join('')}</div><div class="lock-err" id="pinError"></div><div class="lock-pad" id="lockPad">${padKeys}</div><button type="button" class="lock-forgot" id="pinForgot">Pinimi unuttum</button><div id="forgotBox" hidden></div></div>`;
 document.body.appendChild(root);
 const box=$('#lockBox',root),err=$('#pinError',root),sub=$('#lockSub',root),dotsEl=$('#pinDots',root),pad=$('#lockPad',root),forgot=$('#pinForgot',root),fbox=$('#forgotBox',root);
 let buf='',mode='enter',first='',busy=false,curLen=len;
 const dots=()=>[...dotsEl.children];
 const paint=(n,pop)=>{dots().forEach((d,i)=>{const was=d.classList.contains('fill');d.classList.toggle('fill',i<n);if(pop&&i===n-1&&!was){d.classList.remove('pop');void d.offsetWidth;d.classList.add('pop')}})};
 const setLen=n=>{curLen=n;dotsEl.innerHTML=Array.from({length:n},()=>'<i></i>').join('')};
 const shake=()=>{box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake')};
 const unlock=()=>{
  document.removeEventListener('keydown',kd);
  root.style.pointerEvents='none';
  const fade=root.animate([{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(1.05)'}],{duration:380,easing:TAB_EASE,fill:'forwards'});
  fade.onfinish=()=>root.remove();
  [$('.topbar'),$('#mainContent'),$('.bottomnav')].forEach((el,k)=>{if(!el)return;const isNav=el.classList.contains('bottomnav');el.animate([{opacity:0,transform:isNav?'translate3d(-50%,36px,0)':'translate3d(0,18px,0)'},{opacity:1,transform:isNav?'translate3d(-50%,0,0)':'translate3d(0,0,0)'}],{duration:420,delay:70+k*30,easing:TAB_EASE,fill:'backwards'})});
 };
 const reset=()=>{buf='';paint(0)};
 const setSub=t=>{sub.textContent=t};
 const onComplete=async()=>{
  if(busy)return;busy=true;const v=buf;
  try{
   if(mode==='enter'){
    const ok=state.settings.pinHash?(await hashPin(v))===state.settings.pinHash:v===state.settings.pin;
    if(ok){unlock();return}
    err.textContent='PIN doğru değil.';shake();reset();
   }else if(mode==='new1'){
    first=v;buf='';paint(0);mode='new2';setSub('Yeni PIN’i tekrar gir');err.textContent='';
   }else if(mode==='new2'){
    if(v===first){
     state.settings.pinHash=await hashPin(v);state.settings.pinLength=curLen;state.settings.pin='';saveLocal();
     toast('PIN değiştirildi.');unlock();return;
    }
    err.textContent='PIN’ler eşleşmedi.';shake();first='';mode='new1';setSub('Yeni PIN belirle');reset();
   }
  }finally{busy=false}
 };
 const press=k=>{
  if(k==='del'){buf=buf.slice(0,-1);paint(buf.length);return}
  if(buf.length>=curLen)return;
  buf+=k;paint(buf.length,true);err.textContent='';
  if(buf.length===curLen)setTimeout(onComplete,140);
 };
 pad.addEventListener('click',e=>{const b=e.target.closest('[data-key]');if(b)press(b.dataset.key==='del'?'del':b.dataset.key)});
 const kd=e=>{if(!$('#lockscreen'))return;if(/^[0-9]$/.test(e.key))press(e.key);else if(e.key==='Backspace')press('del')};

 const showForgot=()=>{
  const q=state.settings.secretQ;

  pad.hidden=true;dotsEl.hidden=true;forgot.hidden=true;
  fbox.hidden=false;
  fbox.innerHTML=`<p class="lock-q">${q}</p><input id="secretAns" type="text" autocomplete="off" placeholder="Cevap" class="lock-ans"><div class="lock-fbtns"><button type="button" class="secondary" id="fBack">Geri</button><button type="button" class="primary" id="fOk">Doğrula</button></div>`;

 };
 const hideForgot=(toNew)=>{fbox.hidden=true;fbox.innerHTML='';pad.hidden=false;dotsEl.hidden=false;forgot.hidden=false;err.textContent='';if(!toNew)setSub("PIN'ini gir")};

 setLen(len);
 if(state.settings.bioId){
  (async()=>{if(!(await BIO.available()))return;const btn=document.createElement('button');btn.className='bio-btn';btn.type='button';btn.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M9 10v1M15 10v1M9 15c1.5 1.5 4.5 1.5 6 0"/></svg><span>Face ID ile aç</span>';box.appendChild(btn);const tryBio=async()=>{if(await BIO.verify())unlock();else err.textContent='Face ID doğrulanamadı. PIN ile devam et.'};btn.onclick=tryBio;setTimeout(tryBio,350)})();
 }
}
