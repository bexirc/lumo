(()=>{let y=0,active=false,restoreFrame=0;const input=()=>document.getElementById('msgText');
 document.addEventListener('focusin',e=>{if(e.target!==input())return;y=window.scrollY||window.pageYOffset||0;active=true;cancelAnimationFrame(restoreFrame);restoreFrame=requestAnimationFrame(()=>{if(active&&Math.abs((window.scrollY||window.pageYOffset||0)-y)>2)window.scrollTo({top:y,left:0,behavior:'instant'});});},true);
 document.addEventListener('focusout',e=>{if(e.target!==input())return;active=false;},true);
 window.addEventListener('scroll',()=>{if(!active)return;const t=input();if(!t||document.activeElement!==t)return;const now=window.scrollY||window.pageYOffset||0;if(Math.abs(now-y)>2){cancelAnimationFrame(restoreFrame);restoreFrame=requestAnimationFrame(()=>{if(active)window.scrollTo({top:y,left:0,behavior:'instant'});});}}, {passive:true});
})();
</script>

function timeNow(){return new Date().toTimeString().slice(0,5)}

function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open('LUMA_DB_V1',1);req.onupgradeneeded=()=>{const d=req.result;['media','docs','trash'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'})})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}

}
async function txStore(name,mode='readonly'){const d=await getDB();return d.transaction(name,mode).objectStore(name)}

const TAB_ORDER=['home','messages','calendar','memories','documents'];

function changeTab(tab,{dir=1,scroll=null,memoryTab=null,currentAlbum=null}={}){
 const main=$('#mainContent');if(!main){state.tab=tab;render();return}

 const ghost=main.cloneNode(true);
 ghost.removeAttribute('id');ghost.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id'));

 ghost.style.cssText=`position:fixed;left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;margin:0;transform:none;pointer-events:none;z-index:5`;

function __hScroll(el){for(let n=el;n&&n!==document.body;n=n.parentElement){if(n.scrollWidth>n.clientWidth+2){const o=getComputedStyle(n).overflowX;if(o==='auto'||o==='scroll')return true}}return false}

 if(dx<0)return i<TAB_ORDER.length-1?{type:'tab',tab:TAB_ORDER[i+1]}:null;

}
let __sw=null;
const __canSwipe=()=>!state.hiddenPickMode&&!document.body.classList.contains('modal-open')&&!$('#viewer')&&!$('#lockscreen');

 __sw=null;if(e.touches.length!==1||!__canSwipe())return;

},{passive:true});
function __endSwipe(commit){

 if(!s||s.lock!=='x'){main.style.transform='';return}

function setTitle(){const keepNavFull=state.tab==='memories';document.body.classList.toggle('nav-full',keepNavFull);document.body.classList.toggle('nav-min',state.tab==='messages');document.body.classList.toggle('on-home',state.tab==='home');document.body.classList.toggle('hidden-pick-mode',!!state.hiddenPickMode);const titles={home:'Ana Sayfa',messages:'Mesajlar',calendar:'Ajanda',memories:'Medya',documents:state.hiddenPickMode?'Uygulama içinden seç':'Dosyalarım'};$('#pageTitle').textContent=titles[state.tab]||'LUMA';$('#headerSubtitle').textContent=state.hiddenPickMode?'Gizliler için öğeleri seç.':state.tab==='home'?'Kendine dön, kendini keşfet.':state.tab==='memories'?'Anıların sana ait.':'LUMA · Kişisel alanın';const nav=$('.bottomnav'),index=['home','messages','calendar','memories','documents'].indexOf(state.tab);nav?.style.setProperty('--nav-index',String(index));nav?.style.setProperty('--nav-offset',['6px','calc(6px + 20% - 2.4px)','calc(6px + 40% - 4.8px)','calc(6px + 60% - 7.2px)','calc(6px + 80% - 9.6px)'][index]||'6px');$$('.navitem').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));__navWobble()}

function moodStats(records){const avg=records.length?records.reduce((s,r)=>s+r.score,0)/records.length:0;return {avg,completion:Math.min(100,Math.round(records.length/16*100)),count:records.length}}

  const mouth=smile==='sad'?'M7.8 17 Q12 13.5 16.2 17':smile==='flat'?'M8 16 H16':'M7.8 15 Q12 19 16.2 15';
  return `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="8.4" cy="10" r="1.45" fill="var(--surface)"/><circle cx="15.6" cy="10" r="1.45" fill="var(--surface)"/><path d="${mouth}" fill="none" stroke="var(--surface)" stroke-width="1.5" stroke-linecap="round"/></svg>`;

function lumaChart(){

function missingHours(date){const wake=Number((state.settings.wakeTime||'08:00').slice(0,2)),sleep=Number((state.settings.sleepTime||'23:00').slice(0,2));const now=new Date();if(date===dateKey(now)&&now.getHours()<sleep){}const end=date===dateKey(now)?Math.min(sleep,now.getHours()):sleep;const out=[];for(let h=wake;h<end;h++){if(!state.moodRecords.some(r=>r.date===date&&Number(r.time.slice(0,2))===h))out.push(`${String(h).padStart(2,'0')}:00`)}return out}
function stability(records){if(records.length<2)return '—';const avg=records.reduce((s,r)=>s+r.score,0)/records.length;const sd=Math.sqrt(records.reduce((s,r)=>s+Math.pow(r.score-avg,2),0)/records.length);return `${Math.max(0,100-Math.round(sd))}%`}

function isFemale(){return (state.profile?.gender||'')==='Kadın'}
function dayDiff(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000)}
function addDays(k,n){const d=new Date(k+'T00:00:00');d.setDate(d.getDate()+n);return dateKey(d)}
function cycleStats(){const c=state.cycle;const st=[...c.starts].sort();let cyc=c.avgCycle,len=c.avgLen;if(st.length>=2){const gaps=[];for(let i=1;i<st.length;i++)gaps.push(dayDiff(st[i-1],st[i]));cyc=Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length)}const ends=c.ends||[];if(c.starts.length&&ends.length){const L=[];for(const s0 of st){const e=ends.filter(e=>e>=s0).sort()[0];if(e)L.push(dayDiff(s0,e)+1)}if(L.length)len=Math.round(L.reduce((a,b)=>a+b,0)/L.length)}return {cyc,len,last:st[st.length-1]||''}}
function inPeriodDay(k){const st=state.cycle.starts||[];const en=state.cycle.ends||[];const {len}=cycleStats();return st.some(s0=>{if(k<s0)return false;const e=en.filter(x=>x>=s0).sort()[0]||addDays(s0,len-1);return k<=e})}

function stressAvg(arr){return arr.length?Math.round(arr.reduce((a,b)=>a+b.value,0)/arr.length):null}
function reportedKeys(){try{return JSON.parse(localStorage.getItem('luma-stress-reported')||'[]')}catch(e){return []}}
function markReported(k){const a=reportedKeys();if(!a.includes(k))a.push(k);localStorage.setItem('luma-stress-reported',JSON.stringify(a.slice(-80)))}
function buildStressReport(rows,title,key){
 const period=rows.filter(r=>r.inPeriod),normal=rows.filter(r=>!r.inPeriod);
 const lines=[];lines.push(`Genel ortalama: ${stressAvg(rows)} / 100 (${rows.length} ölçüm)`);
 if(isFemale()){lines.push(`Regl dönemi ortalaması: ${stressAvg(period)??'—'} / 100 (${period.length} ölçüm)`);lines.push(`Normal günlerin ortalaması: ${stressAvg(normal)??'—'} / 100 (${normal.length} ölçüm)`)}
 lines.push('');lines.push('Bu rapor tıbbi bir teşhis değildir. Puanlar uzun süre yüksek kalırsa bir uzmana danışmanı öneririz.');
 state.documents.push({id:uuid(),title,date:dateKey(new Date()),history:[{at:Date.now(),note:'Otomatik rapor'}],body:lines.join('\n'),autoReport:true,reportKey:key});
 saveLocal();markReported(key);
 addNotice(`${title} hazır. Dosyalarım'de.`,'',null);
}
function weekKey(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));const wk=Math.ceil((((t-y0)/86400000)+1)/7);return `${t.getUTCFullYear()}-W${String(wk).padStart(2,'0')}`}
function stressReports(){
 const st=state.settings||{};const wk=st.reportWeekly??true;const mo=st.reportMonthly??false;
 const now=new Date();const done=reportedKeys();
 if(wk){
  const k=weekKey(new Date(now.getFullYear(),now.getMonth(),now.getDate()-1));
  const end=new Date(now.getFullYear(),now.getMonth(),now.getDate()-1);const start=new Date(end);start.setDate(end.getDate()-6);
  const rows=(state.stress||[]).filter(r=>r.date>=dateKey(start)&&r.date<=dateKey(end));
  const key='W:'+k;
  if(rows.length&&!done.includes(key))buildStressReport(rows,'Haftalık stres raporu ('+dateKey(start)+' – '+dateKey(end)+')',key);
 }
 if(mo){
  const N=Math.max(1,Math.min(4,state.settings.reportMonthInterval||1));
  const idx=now.getFullYear()*12+now.getMonth();const block=Math.floor(idx/N)-1;
  if(block>=0){
   const startIdx=block*N,endIdx=startIdx+N-1;
   const inRange=d=>{const [y,m]=d.split('-').map(Number);const v=y*12+(m-1);return v>=startIdx&&v<=endIdx};
   const rows=(state.stress||[]).filter(r=>inRange(r.date));
   const sy=Math.floor(startIdx/12),sm=startIdx%12,ey=Math.floor(endIdx/12),em=endIdx%12;
   const a=new Date(sy,sm,1).toLocaleDateString('tr-TR',{month:'long',year:'numeric'});const b2=new Date(ey,em,1).toLocaleDateString('tr-TR',{month:'long',year:'numeric'});
   const title=N===1?`${a} stres raporu`:`${a} – ${b2} stres raporu`;
   const key=`M${N}:${block}`;
   if(rows.length&&!done.includes(key))buildStressReport(rows,title,key);
  }
 }
}

<script id="luma-file-longpress-context-menu">
(()=>{
 let timer=null,startX=0,startY=0,ignoreClickUntil=0,pressedItem=null,openedByHold=false;
 const itemSelector='#mainContent .file-tile, #mainContent .dfold, #mainContent .doc-card, .modalback .file-tile, .modalback .dfold, .modalback .doc-card';
 const getItem=e=>e.target&&e.target.closest?e.target.closest(itemSelector):null;
 const isFolder=item=>!!item?.matches('.dfold[data-folder]');
 const safeId=v=>String(v||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
 const clearPress=()=>{if(timer){clearTimeout(timer);timer=null}pressedItem=null};
 const close=()=>{
  document.removeEventListener('pointerdown',outside,true);
  const pop=document.getElementById('fileContextPopover');
  if(pop){pop.classList.remove('open');setTimeout(()=>{if(pop.isConnected)pop.remove()},220)}
  document.querySelectorAll('.file-tile.longpress-active,.dfold.longpress-active,.doc-card.longpress-active').forEach(x=>x.classList.remove('longpress-active'));
 };
 const outside=e=>{if(e.target.closest&&e.target.closest('#fileContextPopover'))return;close()};
 function open(item){
  if(!item||!item.isConnected)return;
  const folder=isFolder(item);
  const id=folder?item.dataset.folder:(item.dataset.id||item.dataset.hidNote||item.dataset.noteOpen||item.dataset.fdoc||item.dataset.docMediaId||item.dataset.catMedia);
  if(!id){console.debug('LUMA long-press: item has no actionable id',item);return}
  close();openedByHold=true;ignoreClickUntil=Date.now()+900;
  item.classList.add('longpress-active');
  const pop=document.createElement('div');pop.id='fileContextPopover';pop.className='file-context-pop';pop.setAttribute('role','menu');
  let options;
  if(folder){
   const meta=(typeof folderMeta==='function'?folderMeta(id):null);
   options=[['open','↗','Klasörü Aç']];
   if(meta&&(state.docFolders||[]).some(f=>f.id===id))options.push(['rename','✎','Yeniden Adlandır'],['delete-folder','⌫','Klasörü Sil',true]);
  }else options=[['select','✓','Seç'],['hide','◌','Gizle'],['move','↗','Taşı'],['delete','⌫','Sil',true]];
  pop.innerHTML=options.map(([a,ico,label,danger])=>`<button type="button" role="menuitem" data-file-context="${a}" data-id="${safeId(id)}" data-folder-item="${folder?'1':'0'}" class="${danger?'danger':''}"><span class="fcp-icon">${ico}</span><span>${label}</span></button>`).join('');
  document.body.appendChild(pop);pop.style.visibility='hidden';pop.style.opacity='0';
  const r=item.getBoundingClientRect(),w=Math.min(205,innerWidth-24);pop.style.width=w+'px';
  const h=Math.min(pop.scrollHeight,innerHeight-24);let left=r.right+w+10<=innerWidth?r.right+8:r.left-w-8;
  if(left<12||left+w>innerWidth-12)left=Math.max(12,Math.min(r.left,innerWidth-w-12));
  let top=Math.max(12,Math.min(r.top,innerHeight-h-12));if(top+h>innerHeight-12)top=Math.max(12,r.top-h-8);
  pop.style.left=left+'px';pop.style.top=top+'px';pop.style.visibility='visible';
  requestAnimationFrame(()=>{if(pop.isConnected){pop.classList.add('open');pop.style.opacity=''}});
  setTimeout(()=>document.addEventListener('pointerdown',outside,true),0);
 }
 document.addEventListener('pointerdown',e=>{
  const item=getItem(e);
  if(!item||state.tab!=='documents'||state.docSel||state.hiddenPickMode)return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  clearPress();pressedItem=item;startX=e.clientX;startY=e.clientY;
  timer=setTimeout(()=>{timer=null;const target=pressedItem;pressedItem=null;open(target)},520);
 },true);
 document.addEventListener('pointermove',e=>{
  if(!timer)return;
  if(Math.abs(e.clientX-startX)>22||Math.abs(e.clientY-startY)>22)clearPress();
 },{capture:true,passive:true});
 ['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,clearPress,true));
 document.addEventListener('contextmenu',e=>{const item=getItem(e);if(item&&state.tab==='documents'&&!state.docSel&&!state.hiddenPickMode){e.preventDefault();open(item)}},true);
 document.addEventListener('click',e=>{
  const b=e.target.closest&&e.target.closest('#fileContextPopover [data-file-context]');if(!b)return;
  e.preventDefault();e.stopImmediatePropagation();const id=b.dataset.id,action=b.dataset.fileContext,isFolderItem=b.dataset.folderItem==='1';close();
  if(isFolderItem){
   if(action==='open'){if(id==='trash')openTrash();else openFolderPage(id);return}
   const f=(state.docFolders||[]).find(x=>x.id===id);if(!f)return;
   if(action==='rename'){const s=showModal('Klasörü Yeniden Adlandır',`<div class="stack"><input id="renameDocFolder" type="text" value="${String(f.name||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;')}" maxlength="60"><div class="modal-actions"><button class="secondary" data-action="close-modal">Vazgeç</button><button class="primary" id="renameDocFolderSave">Kaydet</button></div></div>`);$('#renameDocFolderSave',s).onclick=()=>{const name=$('#renameDocFolder',s).value.trim();if(!name){toast('Bir klasör adı gir.');return}f.name=name;saveFolders();closeModal();render();toast('Klasörün adı değiştirildi.')};return}
   if(action==='delete-folder'){if(!confirm(`“${f.name}” klasörü silinsin mi? Belgeler otomatik klasörlerine döner.`))return;state.documents.forEach(d=>{if(d.folderId===id)delete d.folderId});state.docFolders=state.docFolders.filter(x=>x.id!==id);saveFolders();saveLocal();render();toast('Klasör silindi.');return}
   return;
  }
  if(action==='select'){state.docSel=true;state.selectedDocs=[id];render();return}
  state.docSel=true;state.selectedDocs=[id];
  if(action==='hide'){selHide();return}
  if(action==='move'){openMoveFolder();return}
  if(action==='delete'){selDelete();return}
 },true);
 document.addEventListener('click',e=>{
  if(Date.now()<ignoreClickUntil&&getItem(e)){e.preventDefault();e.stopImmediatePropagation();ignoreClickUntil=0;openedByHold=false}
 },true);
 document.addEventListener('pointerdown',e=>{if(!(e.target.closest&&e.target.closest('#fileContextPopover'))&&!getItem(e))close()},true);
 document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
})();
</script>
